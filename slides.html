let current = 0;

function renderSlide(idx) {
  const s = SLIDES[idx];
  const vp = document.getElementById('slidesViewport');
  vp.innerHTML = `
    <div class="slide-inner">
      <div class="slide-header">
        <span class="slide-course">PSY101 — Introduction to Learning Theories</span>
        <span class="slide-num-tag">${s.num} / ${SLIDES.length}</span>
      </div>
      <div class="slide-body">
        <h2 class="slide-title">${s.title}</h2>
        <p class="slide-subtitle">${s.subtitle}</p>
        <div class="slide-content">${s.content}</div>
      </div>
    </div>`;
  document.getElementById('slideCounter').textContent = `${s.num} / ${SLIDES.length}`;
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === SLIDES.length - 1;
}

function changeSlide(dir) {
  const next = current + dir;
  if (next >= 0 && next < SLIDES.length) { current = next; renderSlide(current); }
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') changeSlide(1);
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') changeSlide(-1);
  if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  if (e.key === 'Escape') { if (document.fullscreenElement) document.exitFullscreen(); }
});

function toggleFullscreen() {
  const wrap = document.getElementById('slidesWrap');
  const btn = document.getElementById('fsBtn');
  if (!document.fullscreenElement) {
    wrap.requestFullscreen().then(() => { btn.textContent = '✕ Exit Fullscreen'; }).catch(() => {});
  } else {
    document.exitFullscreen();
    btn.textContent = '⛶ Fullscreen';
  }
}
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) document.getElementById('fsBtn').textContent = '⛶ Fullscreen';
});

    .sc{font-size:0.9rem}.sn{background:#e2e8f0;border-radius:99px;padding:6px 18px;font-size:0.82rem;cursor:pointer;border:none;font-weight:600}
    .sn:disabled{opacity:0.4}.snav{display:flex;align-items:center;justify-content:center;gap:1rem;padding:1rem;border-top:1px solid #e2e8f0;background:#f7f9ff}
    .sc-lbl{font-size:0.82rem;color:#718096}
    table{width:100%;border-collapse:collapse;font-size:0.85rem}th{background:#1a2a6c;color:#fff;padding:8px 12px;text-align:left}td{padding:8px 12px;border-bottom:1px solid #e2e8f0}
    .slide-two-col{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}.slide-box{background:#f7f9ff;border:1px solid #e2e8f0;border-radius:8px;padding:1rem;margin-bottom:0.75rem}
    .ai-box{background:#f3f0ff;border-color:#c4b5fd}.slide-list{padding-left:1.2rem}.slide-list li{margin-bottom:0.4rem}
    .slide-list-sm{padding-left:1.2rem;font-size:0.85rem}.slide-list-sm li{margin-bottom:0.3rem}
    .ilo-row{display:flex;align-items:flex-start;gap:0.75rem;margin-bottom:0.5rem;font-size:0.9rem}
    .bloom-badge{flex-shrink:0;padding:3px 10px;border-radius:12px;font-size:0.72rem;font-weight:700;background:#e0e7ff;color:#3730a3}
    .ai-badge{background:#ede9fe;color:#6b21a8}.ai-ilo{background:#faf9ff;border-radius:6px;padding:4px 6px}
    .seq-step{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem;font-size:0.9rem}
    .seq-label{background:#1a2a6c;color:#fff;padding:2px 8px;border-radius:4px;font-size:0.75rem;font-weight:700}
    .seq-arrow{color:#e67e22;font-weight:700}.highlight{background:#fff3cd;border-radius:4px;padding:4px}
    .accent{border-left:4px solid #e67e22}.slide-table{font-size:0.82rem}
    .good-cell{background:#d1fae5;color:#065f46}.bad-cell{background:#fee2e2;color:#991b1b}
    .wide-table td,.wide-table th{font-size:0.78rem;padding:6px 10px}
    .slide-amr{display:flex;flex-direction:column;gap:0.5rem}
    .amr-box{padding:0.6rem 0.9rem;border-radius:6px;font-size:0.88rem}
    .adopt{background:#d1fae5;border-left:4px solid #059669}.modify{background:#fef3c7;border-left:4px solid #d97706}
    .reject{background:#fee2e2;border-left:4px solid #dc2626}
    .slide-process-row{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;margin-bottom:0.75rem}
    .process-box{background:#f7f9ff;border:1px solid #e2e8f0;border-radius:6px;padding:0.6rem;font-size:0.85rem}
    .slide-ilos{display:flex;flex-direction:column;gap:0.4rem}
    .slide-takeaways{display:flex;flex-direction:column;gap:0.75rem}
    .takeaway-item{display:flex;align-items:flex-start;gap:0.75rem;font-size:0.9rem}
    .takeaway-num{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:#1a2a6c;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem}
    .takeaway-box{background:#f3f0ff;border:1px solid #c4b5fd;border-radius:8px;padding:0.9rem;font-size:0.9rem}
    .slide-full{overflow-x:auto}.slide-note{font-size:0.8rem;color:#718096;margin-top:0.5rem}
    h3{font-size:1rem;color:#1a2a6c;margin-bottom:0.75rem}`;

  const allSlides = SLIDES.map((s, i) => `
    <div class="slide-page" id="ds${i}" style="display:${i===0?'block':'none'}">
      <div id="sw"><div class="sh"><span>PSY101 — Introduction to Learning Theories</span><span>${s.num}/${SLIDES.length}</span></div>
      <div class="sb"><h2 class="st">${s.title}</h2><p class="ss">${s.subtitle}</p><div class="sc">${s.content}</div></div></div>
    </div>`).join('');

  const script = `
    let dc=0;const dt=${SLIDES.length};
    function dcs(d){document.getElementById('ds'+dc).style.display='none';dc=Math.max(0,Math.min(dc+d,dt-1));document.getElementById('ds'+dc).style.display='block';document.getElementById('dct').textContent=(dc+1)+'/'+dt;document.getElementById('dpb').disabled=dc===0;document.getElementById('dnb').disabled=dc===dt-1;}
    document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')dcs(1);if(e.key==='ArrowLeft')dcs(-1);});`;

  const html = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PSY101 — Learning Theories Slides</title><style>${styles}</style></head><body>${allSlides}<div class="snav"><button class="sn" id="dpb" onclick="dcs(-1)" disabled>&#8592; Prev</button><span class="sc-lbl" id="dct">1/${SLIDES.length}</span><button class="sn" id="dnb" onclick="dcs(1)">Next &#8594;</button></div><script>${script}<\/script></body></html>`;

  const blob = new Blob([html], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'PSY101-Learning-Theories-Slides.html';
  a.click();
  URL.revokeObjectURL(a.href);
}

// Init
renderSlide(0);
</script>
</body>
</html>
