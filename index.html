<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>氧氣奇幻冒險 - 化學魔法之旅</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', 'PingFang TC', 'Heiti TC', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 魔法背景效果 */
        .magical-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 20"><circle cx="10" cy="10" r="1" fill="rgba(255,255,255,.6)"/><circle cx="30" cy="5" r="1.5" fill="rgba(255,255,255,.4)"/><circle cx="50" cy="15" r="1" fill="rgba(255,255,255,.5)"/><circle cx="70" cy="8" r="2" fill="rgba(255,255,255,.3)"/><circle cx="90" cy="12" r="0.5" fill="rgba(255,255,255,.7)"/></svg>') repeat;
            animation: sparkle 4s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes sparkle {
            0% { opacity: 0.4; transform: rotate(0deg); }
            100% { opacity: 0.8; transform: rotate(360deg); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .game-header {
            text-align: center;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 4px solid rgba(255, 215, 0, 0.4);
            backdrop-filter: blur(15px);
        }

        .game-title {
            font-size: 3em;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            animation: titleGlow 3s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            0% { filter: brightness(1); }
            100% { filter: brightness(1.2); }
        }

        .subtitle {
            font-size: 1.4em;
            color: #718096;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .level-tags {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .level-tag {
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
            color: white;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 0.95em;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            animation: tagFloat 2s ease-in-out infinite alternate;
        }

        @keyframes tagFloat {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-5px); }
        }

        /* 遊戲統計面板 */
        .stats-panel {
            display: flex;
            justify-content: space-between;
            margin: 30px 0;
            gap: 15px;
            flex-wrap: wrap;
        }

        .stat-gem {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.1));
            border: 3px solid rgba(255, 255, 255, 0.4);
            padding: 15px 20px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            flex: 1;
            min-width: 140px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        /* 任務容器 */
        .quest-box {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0.9));
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            border: 4px solid rgba(255, 215, 0, 0.3);
            backdrop-filter: blur(15px);
            position: relative;
        }

        .quest-badge {
            position: absolute;
            top: -20px;
            left: 40px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
            color: white;
            padding: 10px 25px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1em;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            animation: badgePulse 2s ease-in-out infinite;
        }

        @keyframes badgePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .question-text {
            font-size: 1.5em;
            margin-bottom: 30px;
            color: #2d3748;
            font-weight: bold;
            line-height: 1.6;
            padding: 20px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 15px;
            border-left: 6px solid #667eea;
        }

        .answers-grid {
            display: grid;
            gap: 20px;
            margin-bottom: 30px;
        }

        .answer-choice {
            background: linear-gradient(135deg, #f8fafc, #e2e8f0);
            border: 4px solid #e2e8f0;
            border-radius: 18px;
            padding: 20px 25px;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 1.2em;
            position: relative;
            overflow: hidden;
        }

        .answer-choice::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.6s;
        }

        .answer-choice:hover {
            background: linear-gradient(135deg, #edf2f7, #cbd5e0);
            border-color: #a0aec0;
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
        }

        .answer-choice:hover::before {
            left: 100%;
        }

        .answer-choice.selected {
            border-color: #4299e1;
            background: linear-gradient(135deg, #ebf8ff, #bee3f8);
            transform: scale(1.05);
        }

        .answer-choice.correct {
            border-color: #48bb78;
            background: linear-gradient(135deg, #f0fff4, #c6f6d5);
            color: #2f855a;
            animation: correctSparkle 0.8s ease-in-out;
        }

        .answer-choice.incorrect {
            border-color: #f56565;
            background: linear-gradient(135deg, #fed7d7, #feb2b2);
            color: #c53030;
            animation: incorrectShake 0.8s ease-in-out;
        }

        @keyframes correctSparkle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes incorrectShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-12px); }
            75% { transform: translateX(12px); }
        }

        /* 反饋面板 */
        .feedback-panel {
            margin: 30px 0;
            padding: 25px;
            border-radius: 18px;
            display: none;
            position: relative;
            overflow: hidden;
        }

        .feedback-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent);
            animation: feedbackShine 3s ease-in-out infinite;
        }

        @keyframes feedbackShine {
            0%, 100% { transform: translateX(-200%); }
            50% { transform: translateX(200%); }
        }

        .feedback-panel.success {
            background: linear-gradient(135deg, #f0fff4, #c6f6d5);
            border: 4px solid #48bb78;
            color: #2f855a;
        }

        .feedback-panel.error {
            background: linear-gradient(135deg, #fed7d7, #fbb6ce);
            border: 4px solid #f56565;
            color: #c53030;
        }

        .explanation-box {
            background: rgba(247, 250, 252, 0.95);
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            font-size: 1.1em;
            color: #4a5568;
            border-left: 5px solid #667eea;
            backdrop-filter: blur(8px);
        }

        /* 按鈕組 */
        .action-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .magic-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px 35px;
            border-radius: 35px;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: bold;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            margin: 10px;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .magic-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.8s, height 0.8s;
        }

        .magic-btn:hover {
            transform: translateY(-6px) scale(1.05);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .magic-btn:hover::before {
            width: 400px;
            height: 400px;
        }

        .magic-btn:disabled {
            background: linear-gradient(135deg, #a0aec0, #718096);
            cursor: not-allowed;
            transform: none;
        }

        .magic-btn.secondary {
            background: linear-gradient(135deg, #38b2ac 0%, #319795 100%);
        }

        .magic-btn.danger {
            background: linear-gradient(135deg, #f56565 0%, #e53e3e 100%);
        }

        /* 結果頁面 */
        .results-screen {
            text-align: center;
            display: none;
        }

        .final-score-display {
            font-size: 5em;
            color: #4299e1;
            margin: 30px 0;
            font-weight: bold;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.4);
            animation: scoreGlow 2.5s ease-in-out infinite alternate;
        }

        @keyframes scoreGlow {
            0% { text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.4); }
            100% { text-shadow: 4px 4px 25px rgba(66, 153, 225, 0.7); }
        }

        /* 進度條 */
        .progress-bar {
            width: 100%;
            height: 18px;
            background: rgba(226, 232, 240, 0.8);
            border-radius: 12px;
            margin: 30px 0;
            overflow: hidden;
            box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.1);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #48bb78, #38a169, #2f855a);
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        .progress-fill::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent 35%, rgba(255, 255, 255, 0.4) 55%, transparent 75%);
            animation: progressFlow 2.5s ease-in-out infinite;
        }

        @keyframes progressFlow {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* 錯題回顧 */
        .wrong-answers-review {
            text-align: left;
            margin-top: 30px;
            background: linear-gradient(135deg, #fed7d7, #fbb6ce);
            padding: 30px;
            border-radius: 18px;
            border: 4px solid #f56565;
        }

        .wrong-answer-item {
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 2px solid rgba(197, 48, 48, 0.4);
        }

        .wrong-answer-item:last-child {
            border-bottom: none;
        }

        /* 開始畫面 */
        .start-screen {
            text-align: center;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0.9));
            padding: 60px;
            border-radius: 30px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
            border: 5px solid rgba(255, 215, 0, 0.4);
            backdrop-filter: blur(20px);
        }

        .hero-avatar {
            font-size: 8em;
            margin-bottom: 30px;
            animation: heroFloat 4s ease-in-out infinite alternate;
        }

        @keyframes heroFloat {
            0% { transform: translateY(0px) rotate(-3deg); }
            100% { transform: translateY(-25px) rotate(3deg); }
        }

        .high-score-display {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.3), rgba(255, 193, 7, 0.2));
            padding: 20px;
            border-radius: 18px;
            margin: 30px 0;
            color: #744210;
            font-weight: bold;
            font-size: 1.2em;
            border: 3px solid rgba(255, 193, 7, 0.4);
        }

        .achievement-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
            color: white;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 1em;
            margin: 15px 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            animation: badgeShine 3s ease-in-out infinite;
        }

        @keyframes badgeShine {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .game-title {
                font-size: 2.5em;
            }

            .quest-box {
                padding: 30px;
            }

            .answers-grid {
                gap: 15px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .stats-panel {
                justify-content: center;
            }

            .hero-avatar {
                font-size: 5em;
            }

            .final-score-display {
                font-size: 3.5em;
            }
        }

        @media (max-width: 480px) {
            .game-title {
                font-size: 2em;
            }

            .quest-box {
                padding: 25px;
            }

            .answer-choice {
                padding: 18px 20px;
                font-size: 1.1em;
            }

            .start-screen {
                padding: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="magical-background"></div>

    <div class="container">
        <div class="game-header">
            <h1 class="game-title">🧪 氧氣奇幻冒險</h1>
            <p class="subtitle">踏上神奇的化學魔法之旅，探索氧氣的奧秘世界！</p>
            <div class="level-tags">
                <div class="level-tag">適合高小 P4-P6</div>
                <div class="level-tag">中等難度挑戰</div>
            </div>
        </div>

        <!-- 遊戲開始畫面 -->
        <div id="startScreen" class="start-screen">
            <div class="hero-avatar">🧙‍♂️</div>
            <h2 style="font-size: 2.2em; color: #4a5568; margin-bottom: 20px;">🌟 歡迎來到氧氣魔法學院！</h2>
            <p style="font-size: 1.3em; margin: 25px 0; color: #4a5568; line-height: 1.6;">
                勇敢的小魔法師，準備好接受氧氣魔法的終極挑戰了嗎？<br>
                通過10道神秘的魔法試煉，成為傳說中的氧氣大師！
            </p>
            <div class="high-score-display" id="highScoreDisplay" style="display: none;"></div>
            <button class="magic-btn" onclick="beginAdventure()">🚀 開始魔法冒險！</button>
            <button class="magic-btn secondary" onclick="reviewMistakes()" id="reviewBtn" style="display: none;">📚 復習錯誤魔法</button>
        </div>

        <!-- 遊戲進行畫面 -->
        <div id="gameScreen" style="display: none;">
            <div class="stats-panel">
                <div class="stat-gem">🎯 魔法試煉: <span id="currentQuest">1</span>/10</div>
                <div class="stat-gem">✨ 成功施法: <span id="correctAnswers">0</span></div>
                <div class="stat-gem">🏆 魔法能量: <span id="totalScore">0</span></div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>

            <div class="quest-box">
                <div class="quest-badge" id="questBadge">魔法試煉 1</div>
                <div class="question-text" id="questionDisplay"></div>
                <div class="answers-grid" id="answersContainer"></div>
                <div class="feedback-panel" id="feedbackPanel">
                    <div id="feedbackMessage"></div>
                    <div class="explanation-box" id="explanationBox"></div>
                </div>
                <div class="action-buttons">
                    <button class="magic-btn" id="nextBtn" onclick="nextQuest()" style="display: none;">➡️ 下一個試煉</button>
                </div>
            </div>
        </div>

        <!-- 結果畫面 -->
        <div id="resultsScreen" class="results-screen">
            <div class="hero-avatar">🏆</div>
            <h2 style="font-size: 2.5em; color: #4a5568; margin-bottom: 20px;">🎉 魔法冒險完成！</h2>
            <div class="final-score-display" id="finalScoreDisplay"></div>
            <div id="achievementMessage"></div>

            <div class="wrong-answers-review" id="wrongAnswersContainer" style="display: none;">
                <h3 style="font-size: 1.5em; margin-bottom: 20px;">📜 需要加強的魔法知識</h3>
                <div id="wrongAnswersList"></div>
            </div>

            <div class="action-buttons">
                <button class="magic-btn" onclick="restartAdventure()">🔄 重新挑戰</button>
                <button class="magic-btn secondary" onclick="reviewMistakes()" id="reviewMistakesBtn" style="display: none;">📚 復習錯誤魔法</button>
                <button class="magic-btn danger" onclick="returnToStart()">🏠 返回魔法學院</button>
            </div>
        </div>
    </div>

    <script>
        // 魔法試煉題庫 - 10道完整的氧氣化學題目
        const magicalQuests = [
            {
                question: "🌬️ 在神奇的大氣層魔法陣中，氧氣精靈大約佔據了多少比例的空間？",
                options: ["大約 15% 的魔法空間", "大約 21% 的魔法空間", "大約 30% 的魔法空間", "大約 50% 的魔法空間"],
                correct: 1,
                explanation: "在我們美麗的地球大氣層中，氧氣精靈佔據約21%的空間，氮氣巨人佔78%，剩餘1%是其他神奇的氣體元素。這個完美的比例讓地球上所有生物都能健康快樂地生活！"
            },
            {
                question: "🔥 施展火焰魔法需要三個神秘的魔法條件，下列哪一個是絕對必需的魔法元素？",
                options: ["水之精靈的祝福", "氧氣精靈的力量", "二氧化碳幽靈的幫助", "氮氣巨人的支持"],
                correct: 1,
                explanation: "火焰魔法需要三個重要條件：可燃燒的魔法材料、氧氣精靈的助燃魔力，以及足夠高溫的魔法能量。如果缺少其中任何一個條件，火焰魔法都無法成功施展！"
            },
            {
                question: "🫁 當人類小魔法師呼吸時，氧氣精靈主要在身體的哪個神奇器官被吸收進入血液？",
                options: ["心臟魔法城堡", "肺部魔法宮殿", "胃部魔法洞穴", "肝臟魔法森林"],
                correct: 1,
                explanation: "氧氣精靈在肺部魔法宮殿的微小肺泡房間裡被血液魔法使者接收，然後由血液快遞員運送到身體各個角落，為每個細胞提供珍貴的生命能量。"
            },
            {
                question: "🐠 生活在水中的魚類魔法生物，牠們是如何從水中獲得氧氣精靈的魔法力量？",
                options: ["直接喝下魔法水源", "透過神奇的魔法鰓從水中提取氧氣精靈", "游到水面呼吸新鮮空氣", "通過皮膚魔法直接吸收"],
                correct: 1,
                explanation: "魚類擁有特殊的魔法器官叫做鰓，當魔法水流過鰓絲時，鰓會施展特殊咒語從水中提取溶解的氧氣精靈，同時將二氧化碳幽靈送回水中。這是魚類獨有的水下呼吸魔法！"
            },
            {
                question: "🌱 植物魔法師在陽光充足的白天進行光合作用魔法時，會創造出哪種神奇的氣體？",
                options: ["二氧化碳幽靈", "氮氣巨人", "氧氣精靈", "水蒸氣妖精"],
                correct: 2,
                explanation: "植物魔法師是地球上最厲害的魔法師！牠們使用陽光魔法能量，將二氧化碳幽靈和魔法水變成美味的食物，同時慷慨地創造氧氣精靈送給所有生物。這就是為什麼我們要感謝植物，牠們是地球的綠色守護神！"
            },
            {
                question: "🔬 聰明的魔法師想要檢驗神秘瓶子裡是否裝著氧氣精靈，應該使用什麼神奇的檢測方法？",
                options: ["聞一聞魔法香氣", "用帶火星的神奇木條測試", "用力搖晃魔法瓶子", "倒入清澈的魔法水"],
                correct: 1,
                explanation: "這是一個古老而神奇的魔法測試！將帶有微弱火星的木條放入瓶中，如果木條突然重新燃燒並發出明亮的光芒，就證明瓶內住著強大的氧氣精靈。因為氧氣精靈擁有讓火焰更加旺盛的神奇魔力！"
            },
            {
                question: "❄️ 當氧氣精靈在極度寒冷的冰雪魔法影響下變成液體形態時，會展現什麼顏色的神秘光芒？",
                options: ["完全透明無色", "美麗的淡藍色", "神秘的翡翠綠", "燃燒的火焰紅"],
                correct: 1,
                explanation: "這是氧氣精靈最神奇的變身魔法！雖然氣體形態的氧氣精靈是看不見的透明狀態，但當溫度降到極低（-183°C）時，氧氣精靈會變成美麗的淡藍色液體，就像天空的顏色一樣漂亮！"
            },
            {
                question: "🏔️ 當勇敢的魔法師攀登高聳入雲的魔法山峰時，空氣中氧氣精靈的數量會發生什麼變化？",
                options: ["魔法力量會增強", "魔法力量會減弱", "魔法力量保持不變", "先增強然後減弱"],
                correct: 1,
                explanation: "隨著魔法師爬得越來越高，魔法大氣的壓力會逐漸減小，空氣變得稀薄，氧氣精靈的數量也會減少。這就是為什麼高山探險的魔法師會感到呼吸困難，需要特殊的魔法裝備來幫助呼吸！"
            },
            {
                question: "🚑 在治療魔法醫院裡，白袍治療師為病人提供氧氣魔法瓶，這主要是為了達成什麼神奇的治療效果？",
                options: ["施展降低血壓的魔法", "增加血液中氧氣精靈的神奇濃度", "幫助消化食物的魔法", "減輕疼痛的治療咒語"],
                correct: 1,
                explanation: "醫用氧氣魔法是一種溫和而強大的治療魔法，它能增加病人血液中氧氣精靈的濃度，讓身體各個器官獲得充足的生命能量。這對呼吸困難或心臟虛弱的病人來說特別重要，是真正的生命魔法！"
            },
            {
                question: "🌍 如果有一天，地球魔法世界中的所有氧氣精靈突然消失了，會發生什麼可怕的事情？",
                options: ["只有動物魔法師會消失", "植物魔法師會變得更強大", "幾乎所有的魔法生物都無法生存", "只會影響海洋中的魔法生物"],
                correct: 2,
                explanation: "氧氣精靈是維持生命魔法最重要的元素！如果沒有氧氣精靈，動物魔法師無法呼吸，植物魔法師無法進行細胞呼吸，火焰魔法也無法施展，整個地球將變成一個沒有生機的寂靜星球。這提醒我們要珍惜和保護我們的魔法環境！"
            }
        ];

        // 遊戲狀態變數
        let currentQuestIndex = 0;
        let totalMagicalScore = 0;
        let correctSpellsCount = 0;
        let wrongAnswers = [];
        let gameMode = 'normal'; // 'normal' 或 'review'

        // 載入遊戲數據
        function loadGameData() {
            const savedHighScore = localStorage.getItem('oxygenMagicHighScore') || 0;
            const savedWrongAnswers = localStorage.getItem('oxygenMagicWrongAnswers');

            if (savedWrongAnswers) {
                wrongAnswers = JSON.parse(savedWrongAnswers);
                if (wrongAnswers.length > 0) {
                    document.getElementById('reviewBtn').style.display = 'inline-block';
                }
            }

            if (savedHighScore > 0) {
                document.getElementById('highScoreDisplay').innerHTML = `🏆 歷史最高魔法能量: ${savedHighScore}分`;
                document.getElementById('highScoreDisplay').style.display = 'block';
            }
        }

        // 保存遊戲數據
        function saveGameData() {
            const currentHighScore = localStorage.getItem('oxygenMagicHighScore') || 0;
            if (totalMagicalScore > currentHighScore) {
                localStorage.setItem('oxygenMagicHighScore', totalMagicalScore);
            }
            localStorage.setItem('oxygenMagicWrongAnswers', JSON.stringify(wrongAnswers));
        }

        // 開始冒險
        function beginAdventure() {
            gameMode = 'normal';
            resetGameState();
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            loadCurrentQuest();
        }

        // 重置遊戲狀態
        function resetGameState() {
            currentQuestIndex = 0;
            totalMagicalScore = 0;
            correctSpellsCount = 0;
            wrongAnswers = [];
            updateGameStats();
            updateProgressBar();
        }

        // 復習錯誤
        function reviewMistakes() {
            if (wrongAnswers.length === 0) {
                alert('🎉 太厲害了！你目前沒有需要復習的錯誤魔法！');
                return;
            }

            gameMode = 'review';
            currentQuestIndex = 0;
            totalMagicalScore = 0;
            correctSpellsCount = 0;

            // 只顯示之前答錯的題目
            const savedWrongAnswers = [...wrongAnswers];
            wrongAnswers = [];

            // 重新排列錯題
            magicalQuests.splice(0, magicalQuests.length, ...savedWrongAnswers);

            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            loadCurrentQuest();
        }

        // 載入當前題目
        function loadCurrentQuest() {
            if (currentQuestIndex >= magicalQuests.length) {
                showFinalResults();
                return;
            }

            const quest = magicalQuests[currentQuestIndex];
            document.getElementById('questBadge').textContent = `魔法試煉 ${currentQuestIndex + 1}`;
            document.getElementById('questionDisplay').textContent = quest.question;

            const answersContainer = document.getElementById('answersContainer');
            answersContainer.innerHTML = '';

            quest.options.forEach((option, index) => {
                const answerDiv = document.createElement('div');
                answerDiv.className = 'answer-choice';
                answerDiv.textContent = option;
                answerDiv.onclick = () => selectAnswer(index);
                answersContainer.appendChild(answerDiv);
            });

            document.getElementById('feedbackPanel').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';

            updateGameStats();
            updateProgressBar();
        }

        // 選擇答案
        function selectAnswer(selectedIndex) {
            const quest = magicalQuests[currentQuestIndex];
            const answerChoices = document.querySelectorAll('.answer-choice');

            // 禁用所有選項
            answerChoices.forEach(choice => choice.onclick = null);

            // 標記選中答案
            answerChoices[selectedIndex].classList.add('selected');

            // 顯示正確答案
            answerChoices[quest.correct].classList.add('correct');

            const isCorrect = selectedIndex === quest.correct;

            if (!isCorrect) {
                answerChoices[selectedIndex].classList.add('incorrect');
                // 記錄錯誤答案
                wrongAnswers.push({
                    question: quest.question,
                    options: quest.options,
                    correct: quest.correct,
                    explanation: quest.explanation,
                    userAnswer: selectedIndex
                });
            } else {
                correctSpellsCount++;
                totalMagicalScore += 10;
            }

            // 顯示反饋
            showFeedback(isCorrect, quest);
            updateGameStats();
        }

        // 顯示反饋
        function showFeedback(isCorrect, quest) {
            const feedbackPanel = document.getElementById('feedbackPanel');
            const feedbackMessage = document.getElementById('feedbackMessage');
            const explanationBox = document.getElementById('explanationBox');

            if (isCorrect) {
                feedbackPanel.className = 'feedback-panel success';
                feedbackMessage.textContent = '🎉 魔法施展成功！你獲得了神奇的魔法能量！';
            } else {
                feedbackPanel.className = 'feedback-panel error';
                feedbackMessage.textContent = `❌ 魔法失敗了！正確的魔法答案是：${quest.options[quest.correct]}`;
            }

            explanationBox.textContent = quest.explanation;
            feedbackPanel.style.display = 'block';

            document.getElementById('nextBtn').style.display = 'inline-block';
        }

        // 下一個任務
        function nextQuest() {
            currentQuestIndex++;
            loadCurrentQuest();
        }

        // 更新遊戲統計
        function updateGameStats() {
            document.getElementById('currentQuest').textContent = currentQuestIndex + 1;
            document.getElementById('correctAnswers').textContent = correctSpellsCount;
            document.getElementById('totalScore').textContent = totalMagicalScore;
        }

        // 更新進度條
        function updateProgressBar() {
            const progress = (currentQuestIndex / magicalQuests.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        // 顯示最終結果
        function showFinalResults() {
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('resultsScreen').style.display = 'block';

            const percentage = Math.round((correctSpellsCount / magicalQuests.length) * 100);
            document.getElementById('finalScoreDisplay').textContent = `${totalMagicalScore} 魔法能量`;

            let achievementTitle = '';
            let achievementMessage = '';

            if (percentage >= 90) {
                achievementTitle = '🌟 傳說中的氧氣大魔法師';
                achievementMessage = '太不可思議了！你已經掌握了氧氣魔法的最高奧秘，成為了傳說中的氧氣大魔法師！你對氧氣知識的理解已經達到了大師級水平！';
            } else if (percentage >= 70) {
                achievementTitle = '⭐ 優秀的化學魔法學徒';
                achievementMessage = '很棒的表現！你是一位非常有潛力的化學魔法學徒，繼續努力學習，你很快就能成為真正的魔法師！';
            } else if (percentage >= 50) {
                achievementTitle = '📖 努力學習的魔法見習生';
                achievementMessage = '不錯的開始！作為一名魔法見習生，你已經展現了學習的熱忱，多加練習魔法咒語，你會變得更加強大！';
            } else {
                achievementTitle = '🔰 勇敢的魔法新手';
                achievementMessage = '每個偉大的魔法師都是從新手開始的！不要灰心，多復習魔法知識，相信你很快就能掌握氧氣魔法的奧秘！';
            }

            document.getElementById('achievementMessage').innerHTML = `
                <div style="margin: 30px 0;">
                    <div class="achievement-badge" style="font-size: 1.3em; margin: 15px;">${achievementTitle}</div>
                </div>
                <p style="font-size: 1.3em; margin: 20px 0; font-weight: bold;">魔法成功率：${percentage}%</p>
                <p style="font-size: 1.2em; color: #4a5568; line-height: 1.8; max-width: 600px; margin: 0 auto;">${achievementMessage}</p>
            `;

            // 顯示錯誤回顧
            if (wrongAnswers.length > 0) {
                document.getElementById('wrongAnswersContainer').style.display = 'block';
                document.getElementById('reviewMistakesBtn').style.display = 'inline-block';

                const wrongList = document.getElementById('wrongAnswersList');
                wrongList.innerHTML = '';

                wrongAnswers.forEach((mistake, index) => {
                    const mistakeDiv = document.createElement('div');
                    mistakeDiv.className = 'wrong-answer-item';
                    mistakeDiv.innerHTML = `
                        <strong style="color: #2d3748; font-size: 1.1em;">需要加強的魔法 ${index + 1}:</strong> ${mistake.question}<br>
                        <span style="color: #c53030; font-weight: bold; margin-top: 8px; display: inline-block;">🔮 你選擇的答案：${mistake.options[mistake.userAnswer]}</span><br>
                        <span style="color: #2f855a; font-weight: bold; margin-top: 5px; display: inline-block;">✨ 正確的魔法答案：${mistake.options[mistake.correct]}</span><br>
                        <div style="background: rgba(255,255,255,0.8); padding: 15px; border-radius: 10px; margin-top: 12px; border-left: 4px solid #667eea;">
                            <em style="color: #4a5568; font-size: 1.05em;">${mistake.explanation}</em>
                        </div>
                    `;
                    wrongList.appendChild(mistakeDiv);
                });
            }

            saveGameData();
        }

        // 重新開始冒險
        function restartAdventure() {
            // 重新載入頁面以恢復原始題目順序
            location.reload();
        }

        // 返回開始畫面
        function returnToStart() {
            document.getElementById('resultsScreen').style.display = 'none';
            document.getElementById('startScreen').style.display = 'block';
            loadGameData();
        }

        // 頁面載入時初始化
        window.onload = function() {
            loadGameData();
        };
    </script>
</body>
</html>
