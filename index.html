<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inclusive Education | Process Demonstration</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #4A90E2;
    --primary-dark: #357ABD;
    --secondary: #F5A623;
    --success: #7ED321;
    --accent: #BD10E4;
    --bg: #f0f4f8;
    --card: #ffffff;
    --text: #2c3e50;
    --text-light: #7f8c8d;
    --border: #e1e8ed;
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    color: var(--text);
  }

  .app {
    width: 100%;
    max-width: 1100px;
    background: var(--card);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    padding: 18px 28px;
  }
  .header h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .header p { font-size: 0.85rem; opacity: 0.92; }
  .header .badge {
    display: inline-block;
    background: rgba(255,255,255,0.2);
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 0.7rem;
    margin-top: 6px;
  }

  /* Steps bar */
  .steps-bar {
    display: flex;
    background: #f8f9fa;
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    gap: 6px;
  }
  .step-dot {
    flex: 1;
    padding: 8px 6px;
    background: white;
    border: 2px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s;
    text-align: center;
    font-size: 0.75rem;
    font-weight: 600;
    user-select: none;
    position: relative;
  }
  .step-dot .num {
    display: inline-block;
    width: 20px; height: 20px;
    line-height: 18px;
    border-radius: 50%;
    background: var(--border);
    color: white;
    margin-right: 4px;
    font-size: 0.7rem;
    transition: all 0.3s;
  }
  .step-dot:hover { border-color: var(--primary); transform: translateY(-1px); }
  .step-dot.active { background: var(--primary); color: white; border-color: var(--primary); }
  .step-dot.active .num { background: white; color: var(--primary); }
  .step-dot.completed { background: #e8f5e9; border-color: var(--success); color: #2e7d32; }
  .step-dot.completed .num { background: var(--success); }

  /* Stage */
  .stage {
    position: relative;
    width: 100%;
    height: 420px;
    background: linear-gradient(180deg, #87CEEB 0%, #b8e0f5 60%, #c8e6c9 100%);
    overflow: hidden;
  }
  .scene {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.5s ease;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .scene.active { opacity: 1; }
  .scene svg { width: 100%; height: 100%; }

  /* Hotspots */
  .hotspot {
    position: absolute;
    width: 30px; height: 30px;
    background: rgba(245, 166, 35, 0.95);
    border: 2px solid white;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: bold;
    font-size: 0.8rem;
    animation: pulse 2s infinite;
    z-index: 10;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 2px 6px rgba(245,166,35,0.5); }
    50% { transform: scale(1.15); box-shadow: 0 4px 12px rgba(245,166,35,0.8); }
  }
  .hotspot:hover { background: var(--secondary); }
  .hotspot:hover .tooltip,
  .hotspot:focus .tooltip { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(-4px); }
  .tooltip {
    position: absolute;
    bottom: 38px;
    left: 50%;
    transform: translateX(-50%) translateY(0);
    background: rgba(44, 62, 80, 0.97);
    color: white;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 0.78rem;
    font-weight: normal;
    width: max-content;
    max-width: 240px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s;
    z-index: 30;
    line-height: 1.4;
    box-shadow: 0 6px 18px rgba(0,0,0,0.3);
  }
  .tooltip::after {
    content: '';
    position: absolute;
    top: 100%; left: 50%;
    margin-left: -6px;
    border: 6px solid transparent;
    border-top-color: rgba(44, 62, 80, 0.97);
  }
  .tooltip strong { color: var(--secondary); display: block; margin-bottom: 3px; }

  /* Progress */
  .progress {
    height: 5px;
    background: var(--border);
    position: relative;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    width: 0%;
    transition: width 0.1s linear;
  }

  /* Info panel */
  .info-panel {
    padding: 18px 28px;
    background: white;
    border-top: 1px solid var(--border);
  }
  .step-title {
    font-size: 1.15rem;
    color: var(--primary-dark);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .step-title .step-num {
    background: var(--primary);
    color: white;
    width: 28px; height: 28px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
  }
  .step-description {
    font-size: 0.92rem;
    line-height: 1.65;
    color: var(--text);
  }
  .hk-cursor {
    display: inline-block;
    background: linear-gradient(90deg, #EE3B3B, #fff, #008751);
    color: white;
    padding: 1px 8px;
    border-radius: 4px;
    font-size: 0.72rem;
    margin-left: 6px;
    font-weight: 600;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }

  /* Controls */
  .controls {
    padding: 14px 20px;
    background: #f8f9fa;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 9px 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.88rem;
    font-weight: 600;
    transition: all 0.2s;
    background: var(--primary);
    color: white;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(74,144,226,0.4); }
  .btn:active { transform: translateY(0); }
  .btn.secondary { background: #95a5a6; }
  .btn.secondary:hover { box-shadow: 0 4px 10px rgba(149,165,166,0.4); }
  .btn.toggle { background: #bdc3c7; }
  .btn.toggle.active { background: var(--success); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .speed-control {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
  }
  .speed-control label { font-size: 0.82rem; color: var(--text-light); font-weight: 600; }
  .speed-btn {
    padding: 6px 10px;
    border: 1px solid var(--border);
    background: white;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text);
    transition: all 0.2s;
  }
  .speed-btn:hover { border-color: var(--primary); }
  .speed-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

  /* Character animations */
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2px); }
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-1deg); }
    50% { transform: rotate(1deg); }
  }
  @keyframes spin-slow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes appear {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes drawLine {
    from { stroke-dashoffset: 1000; }
    to { stroke-dashoffset: 0; }
  }
  .scene.active .anim-float { animation: float 3s ease-in-out infinite; }
  .scene.active .anim-bob { animation: bob 2.2s ease-in-out infinite; }
  .scene.active .anim-sway { animation: sway 3.5s ease-in-out infinite; transform-origin: bottom center; }
  .scene.active .anim-appear { animation: appear 0.8s ease-out both; }
  .scene.active .anim-appear:nth-child(2) { animation-delay: 0.2s; }
  .scene.active .anim-appear:nth-child(3) { animation-delay: 0.4s; }
  .scene.active .anim-appear:nth-child(4) { animation-delay: 0.6s; }
  .scene.active .anim-appear:nth-child(5) { animation-delay: 0.8s; }

  /* Narration indicator */
  .narration-indicator {
    position: absolute;
    top: 12px; right: 12px;
    background: rgba(0,0,0,0.55);
    color: white;
    padding: 6px 12px;
    border-radius: 16px;
    font-size: 0.75rem;
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 20;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .narration-indicator.active { opacity: 1; }
  .narration-indicator .wave {
    display: inline-flex;
    gap: 2px;
    height: 14px;
    align-items: center;
  }
  .narration-indicator .wave span {
    display: inline-block;
    width: 3px;
    background: var(--secondary);
    border-radius: 2px;
    animation: sound-wave 0.8s ease-in-out infinite;
  }
  .narration-indicator .wave span:nth-child(1) { height: 6px; animation-delay: 0s; }
  .narration-indicator .wave span:nth-child(2) { height: 12px; animation-delay: 0.15s; }
  .narration-indicator .wave span:nth-child(3) { height: 8px; animation-delay: 0.3s; }
  .narration-indicator .wave span:nth-child(4) { height: 14px; animation-delay: 0.45s; }
  @keyframes sound-wave {
    0%, 100% { transform: scaleY(0.5); }
    50% { transform: scaleY(1); }
  }

  /* Scene label */
  .scene-label {
    position: absolute;
    top: 12px; left: 12px;
    background: rgba(255,255,255,0.92);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 16px;
    font-size: 0.8rem;
    font-weight: 600;
    z-index: 15;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

  /* Responsive */
  @media (max-width: 700px) {
    .stage { height: 320px; }
    .header h1 { font-size: 1.15rem; }
    .step-dot { font-size: 0.65rem; padding: 6px 3px; }
    .step-dot .num { width: 16px; height: 16px; line-height: 14px; font-size: 0.6rem; }
    .speed-control { margin-left: 0; width: 100%; justify-content: flex-start; }
    .btn { padding: 7px 12px; font-size: 0.8rem; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>Inclusive Education: A Process Demonstration</h1>
    <p>Hong Kong Integrated Education Framework &middot; Whole School Approach</p>
    <span class="badge">University Level &middot; Teacher Education</span>
  </div>

  <div class="steps-bar" id="stepsBar"></div>

  <div class="stage" id="stage">
    <div class="scene-label" id="sceneLabel">Step 1 of 5</div>
    <div class="narration-indicator" id="narrIndicator">
      <div class="wave"><span></span><span></span><span></span><span></span></div>
      <span>Narrating...</span>
    </div>
  </div>

  <div class="progress"><div class="progress-fill" id="progressFill"></div></div>

  <div class="info-panel">
    <h2 class="step-title"><span class="step-num" id="stepNum">1</span><span id="stepTitle">Step 1</span><span class="hk-cursor">HK Curriculum</span></h2>
    <p class="step-description" id="stepDescription"></p>
  </div>

  <div class="controls">
    <button class="btn" id="playBtn">&#9658; Play</button>
    <button class="btn secondary" id="prevBtn">&#9664; Prev</button>
    <button class="btn secondary" id="nextBtn">Next &#9654;</button>
    <button class="btn toggle active" id="loopBtn">&#8635; Loop: On</button>
    <button class="btn toggle active" id="narrationBtn">&#128266; Narration: On</button>
    <div class="speed-control">
      <label>Speed:</label>
      <button class="speed-btn" data-speed="0.5">0.5&times;</button>
      <button class="speed-btn active" data-speed="1">1&times;</button>
      <button class="speed-btn" data-speed="1.5">1.5&times;</button>
      <button class="speed-btn" data-speed="2">2&times;</button>
    </div>
  </div>
</div>

const SCENES = [scene1, scene2, scene3, scene4, scene5];

/* ---------- Build steps bar ---------- */
function buildStepsBar() {
  stepsBar.innerHTML = '';
  STEPS.forEach((step, i) => {
    const dot = document.createElement('div');
    dot.className = 'step-dot' + (i === 0 ? ' active' : '');
    dot.innerHTML = `<span class="num">${i+1}</span>${step.title.split(':')[0]}`;
    dot.addEventListener('click', () => goToStep(i));
    stepsBar.appendChild(dot);
  });
}

/* ---------- Render scene ---------- */
function renderScene(index) {
  // Remove old scenes
  stage.querySelectorAll('.scene').forEach(s => s.remove());

  const scene = document.createElement('div');
  scene.className = 'scene active';
  scene.innerHTML = SCENES[index];
  stage.appendChild(scene);

  // Add hotspots
  const step = STEPS[index];
  step.hotspots.forEach(hs => {
    const el = document.createElement('div');
    el.className = 'hotspot';
    el.style.left = hs.x + '%';
    el.style.top = hs.y + '%';
    el.setAttribute('tabindex', '0');
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', hs.title);
    el.innerHTML = `${hs.label}<div class="tooltip"><strong>${hs.title}</strong>${hs.text}</div>`;
    scene.appendChild(el);
  });

  // Update info panel
  stepTitle.textContent = step.title;
  stepDescription.textContent = step.description;
  stepNum.textContent = index + 1;
  sceneLabel.textContent = `Step ${index + 1} of ${STEPS.length}`;
}

/* ---------- Update step indicators ---------- */
function updateStepIndicators() {
  const dots = stepsBar.querySelectorAll('.step-dot');
  dots.forEach((d, i) => {
    d.classList.remove('active', 'completed');
    if (i < currentStep) d.classList.add('completed');
    else if (i === currentStep) d.classList.add('active');
  });
}

/* ---------- Navigation ---------- */
function goToStep(index) {
  stopTimers();
  currentStep = ((index % STEPS.length) + STEPS.length) % STEPS.length;
  renderScene(currentStep);
  updateStepIndicators();
  progressValue = 0;
  progressFill.style.width = '0%';
  if (isPlaying) {
    speakCurrentStep();
    startStepTimer();
  }
}

function nextStep() { goToStep(currentStep + 1); }
function prevStep() { goToStep(currentStep - 1); }

/* ---------- Play/Pause ---------- */
function togglePlay() {
  isPlaying = !isPlaying;
  if (isPlaying) {
    playBtn.innerHTML = '&#10074;&#10074; Pause';
    speakCurrentStep();
    startStepTimer();
  } else {
    playBtn.innerHTML = '&#9658; Play';
    stopTimers();
    stopNarration();
  }
}

/* ---------- Timers ---------- */
function startStepTimer() {
  stopTimers();
  const step = STEPS[currentStep];
  const duration = step.duration / speed;
  const tickMs = 50;
  const increment = (tickMs / duration) * 100;

  progressTimer = setInterval(() => {
    progressValue += increment;
    if (progressValue >= 100) {
      progressValue = 0;
      advanceStep();
    } else {
      progressFill.style.width = progressValue + '%';
    }
  }, tickMs);
}

function stopTimers() {
  if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
}

function advanceStep() {
  stopTimers();
  progressValue = 0;
  progressFill.style.width = '0%';

  if (currentStep === STEPS.length - 1 && !isLooping) {
    isPlaying = false;
    playBtn.innerHTML = '&#9658; Play';
    stopNarration();
    return;
  }
  nextStep();
}

/* ---------- Voice Narration ---------- */
function loadVoices() {
  if (!('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices();
  if (voices.length === 0) return;
  voicesLoaded = true;
  // Prefer en-GB or en-US English voice
  preferredVoice = voices.find(v => /en-GB/i.test(v.lang) && /female|Google|Samantha/i.test(v.name))
    || voices.find(v => /en-GB/i.test(v.lang))
    || voices.find(v => /en-US/i.test(v.lang) && /female|Google|Samantha/i.test(v.name))
    || voices.find(v => /en-US/i.test(v.lang))
    || voices.find(v => /^en/i.test(v.lang))
    || voices[0];
}

function speakCurrentStep() {
  if (!narrationEnabled || !('speechSynthesis' in window)) return;
  stopNarration();
  // Small delay to let any pending cancel complete
  setTimeout(() => {
    const utter = new SpeechSynthesisUtterance(STEPS[currentStep].narration);
    utter.rate = speed;
    utter.pitch = 1;
    utter.volume = 1;
    if (preferredVoice) utter.voice = preferredVoice;
    utter.onstart = () => narrIndicator.classList.add('active');
    utter.onend = () => narrIndicator.classList.remove('active');
    utter.onerror = () => narrIndicator.classList.remove('active');
    window.speechSynthesis.speak(utter);
  }, 80);
}

function stopNarration() {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
  narrIndicator.classList.remove('active');
}

/* ---------- Speed ---------- */
function setSpeed(s) {
  speed = s;
  document.querySelectorAll('.speed-btn').forEach(b => {
    b.classList.toggle('active', parseFloat(b.dataset.speed) === s);
  });
  if (isPlaying) {
    startStepTimer();
    speakCurrentStep();
  }
}

/* ---------- Loop ---------- */
function toggleLoop() {
  isLooping = !isLooping;
  loopBtn.classList.toggle('active', isLooping);
  loopBtn.innerHTML = isLooping ? '&#8635; Loop: On' : '&#8635; Loop: Off';
}

/* ---------- Narration toggle ---------- */
function toggleNarration() {
  narrationEnabled = !narrationEnabled;
  narrationBtn.classList.toggle('active', narrationEnabled);
  narrationBtn.innerHTML = narrationEnabled ? '&#128266; Narration: On' : '&#128266; Narration: Off';
  if (!narrationEnabled) {
    stopNarration();
  } else if (isPlaying) {
    speakCurrentStep();
  }
}

/* ---------- Event Listeners ---------- */
playBtn.addEventListener('click', togglePlay);
prevBtn.addEventListener('click', prevStep);
nextBtn.addEventListener('click', nextStep);
loopBtn.addEventListener('click', toggleLoop);
narrationBtn.addEventListener('click', toggleNarration);
document.querySelectorAll('.speed-btn').forEach(b => {
  b.addEventListener('click', () => setSpeed(parseFloat(b.dataset.speed)));
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  switch(e.key) {
    case ' ':
    case 'k':
      e.preventDefault(); togglePlay(); break;
    case 'ArrowRight':
    case 'l':
      e.preventDefault(); nextStep(); break;
    case 'ArrowLeft':
    case 'j':
      e.preventDefault(); prevStep(); break;
    case '1': case '2': case '3': case '4': case '5':
      goToStep(parseInt(e.key) - 1); break;
  }
});

// Load voices (some browsers need this event)
if ('speechSynthesis' in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

/* ---------- Init ---------- */
buildStepsBar();
renderScene(0);
</script>
</body>
</html>
