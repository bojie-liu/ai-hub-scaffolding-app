<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generative AI 複習網站 | 大學課程</title>
  <style>
    /* ===== CSS Variables & Theme ===== */
    :root {
      --bg-primary: #f8f9fc;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --bg-nav: rgba(255,255,255,0.95);
      --text-primary: #1a1a2e;
      --text-secondary: #4a4a6a;
      --text-muted: #8888a8;
      --accent: #6c5ce7;
      --accent-light: #a29bfe;
      --accent-dark: #5a4bd1;
      --success: #00b894;
      --warning: #fdcb6e;
      --danger: #e17055;
      --border: #e8e8f0;
      --shadow: 0 4px 20px rgba(0,0,0,0.06);
      --shadow-lg: 0 10px 40px rgba(0,0,0,0.1);
      --radius: 12px;
      --radius-sm: 8px;
      --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    [data-theme="dark"] {
      --bg-primary: #0f0f1a;
      --bg-secondary: #1a1a2e;
      --bg-card: #222240;
      --bg-nav: rgba(26,26,46,0.95);
      --text-primary: #e8e8f0;
      --text-secondary: #b8b8d0;
      --text-muted: #7878a0;
      --accent: #a29bfe;
      --accent-light: #6c5ce7;
      --accent-dark: #b8b0ff;
      --border: #333355;
      --shadow: 0 4px 20px rgba(0,0,0,0.3);
      --shadow-lg: 0 10px 40px rgba(0,0,0,0.4);
    }

    /* ===== Reset & Base ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; scroll-padding-top: 80px; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.7;
      transition: background var(--transition), color var(--transition);
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-dark); }

    /* ===== Navigation ===== */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: var(--bg-nav);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      transition: background var(--transition);
    }
    .navbar-inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      height: 64px;
    }
    .navbar-brand {
      font-size: 1.25rem; font-weight: 700; color: var(--accent);
      display: flex; align-items: center; gap: 8px;
    }
    .navbar-brand span { font-size: 1.5rem; }
    .navbar-links {
      display: flex; align-items: center; gap: 4px; list-style: none;
    }
    .navbar-links a {
      padding: 8px 16px; border-radius: var(--radius-sm);
      color: var(--text-secondary); font-size: 0.9rem; font-weight: 500;
      transition: all var(--transition);
    }
    .navbar-links a:hover, .navbar-links a.active {
      background: var(--accent); color: #fff;
    }
    .nav-controls {
      display: flex; align-items: center; gap: 12px;
    }
    .theme-toggle {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--bg-card); border: 1px solid var(--border);
      cursor: pointer; font-size: 1.2rem;
      display: flex; align-items: center; justify-content: center;
      transition: all var(--transition);
    }
    .theme-toggle:hover { background: var(--accent); color: #fff; }
    .search-toggle {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--bg-card); border: 1px solid var(--border);
      cursor: pointer; font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      transition: all var(--transition);
    }
    .search-toggle:hover { background: var(--accent); color: #fff; }
    .hamburger {
      display: none; background: none; border: none;
      font-size: 1.5rem; cursor: pointer; color: var(--text-primary);
    }

    /* ===== Search Overlay ===== */
    .search-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
      z-index: 2000; display: none; align-items: flex-start; justify-content: center;
      padding-top: 120px;
    }
    .search-overlay.active { display: flex; }
    .search-box {
      background: var(--bg-card); border-radius: var(--radius);
      width: 90%; max-width: 600px; padding: 24px;
      box-shadow: var(--shadow-lg);
    }
    .search-input-wrap {
      display: flex; align-items: center; gap: 12px;
      border: 2px solid var(--accent); border-radius: var(--radius-sm);
      padding: 12px 16px; margin-bottom: 16px;
    }
    .search-input-wrap input {
      flex: 1; border: none; outline: none; background: transparent;
      font-size: 1.1rem; color: var(--text-primary);
    }
    .search-results { max-height: 400px; overflow-y: auto; }
    .search-result-item {
      padding: 12px; border-radius: var(--radius-sm);
      cursor: pointer; transition: background var(--transition);
      border-bottom: 1px solid var(--border);
    }
    .search-result-item:hover { background: var(--bg-primary); }
    .search-result-item h4 { font-size: 0.95rem; color: var(--accent); margin-bottom: 4px; }
    .search-result-item p { font-size: 0.85rem; color: var(--text-muted); }
    .search-highlight { background: var(--warning); padding: 0 2px; border-radius: 2px; }

    /* ===== Pages ===== */
    .page { display: none; padding: 88px 24px 40px; min-height: 100vh; }
    .page.active { display: block; }
    .page-inner { max-width: 1000px; margin: 0 auto; }

    /* ===== Hero ===== */
    .hero {
      text-align: center; padding: 60px 0 40px;
    }
    .hero h1 {
      font-size: 2.8rem; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), #e17055);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 16px;
    }
    .hero p { font-size: 1.15rem; color: var(--text-secondary); max-width: 600px; margin: 0 auto 32px; }
    .hero-stats {
      display: flex; justify-content: center; gap: 40px; flex-wrap: wrap;
    }
    .hero-stat { text-align: center; }
    .hero-stat .num { font-size: 2rem; font-weight: 700; color: var(--accent); }
    .hero-stat .label { font-size: 0.85rem; color: var(--text-muted); }

    /* ===== Section ===== */
    .section { margin-bottom: 48px; }
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
    }
    .section-title {
      font-size: 1.5rem; font-weight: 700;
      display: flex; align-items: center; gap: 10px;
    }
    .section-title .icon { font-size: 1.3rem; }

    /* ===== Cards ===== */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--bg-card); border-radius: var(--radius);
      border: 1px solid var(--border); padding: 24px;
      box-shadow: var(--shadow); transition: all var(--transition);
      position: relative; cursor: pointer;
    }
    .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
    .card-tag {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: 0.75rem; font-weight: 600; margin-bottom: 12px;
      background: var(--accent); color: #fff;
    }
    .card h3 { font-size: 1.1rem; margin-bottom: 8px; }
    .card p { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.6; }
    .card-bookmark {
      position: absolute; top: 16px; right: 16px;
      background: none; border: none; font-size: 1.3rem;
      cursor: pointer; color: var(--text-muted);
      transition: all var(--transition);
    }
    .card-bookmark.bookmarked { color: var(--warning); }
    .card-bookmark:hover { transform: scale(1.2); }
    .card-progress {
      margin-top: 16px; height: 4px; background: var(--border); border-radius: 2px;
    }
    .card-progress-bar {
      height: 100%; background: var(--accent); border-radius: 2px;
      transition: width 0.5s ease;
    }

    /* ===== Modal ===== */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
      z-index: 3000; display: none; align-items: center; justify-content: center;
      padding: 24px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--bg-card); border-radius: var(--radius);
      max-width: 700px; width: 100%; max-height: 85vh; overflow-y: auto;
      box-shadow: var(--shadow-lg); padding: 32px;
      animation: modalIn 0.3s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border);
    }
    .modal-header h2 { font-size: 1.4rem; }
    .modal-close {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--bg-primary); border: 1px solid var(--border);
      cursor: pointer; font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      transition: all var(--transition);
    }
    .modal-close:hover { background: var(--danger); color: #fff; border-color: transparent; }
    .modal-body { line-height: 1.8; }
    .modal-body h3 { margin: 20px 0 10px; color: var(--accent); font-size: 1.1rem; }
    .modal-body ul { padding-left: 20px; margin: 8px 0; }
    .modal-body li { margin-bottom: 6px; color: var(--text-secondary); }
    .modal-body p { color: var(--text-secondary); margin-bottom: 10px; }
    .modal-body .key-concept {
      background: linear-gradient(135deg, rgba(108,92,231,0.1), rgba(162,155,254,0.1));
      border-left: 4px solid var(--accent); padding: 12px 16px;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      margin: 16px 0;
    }

    /* ===== Flashcards ===== */
    .flashcard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }
    .flashcard-wrapper { perspective: 800px; height: 240px; }
    .flashcard {
      width: 100%; height: 100%;
      transition: transform 0.6s cubic-bezier(0.4,0,0.2,1);
      transform-style: preserve-3d; cursor: pointer;
      position: relative;
    }
    .flashcard.flipped { transform: rotateY(180deg); }
    .flashcard-front, .flashcard-back {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      backface-visibility: hidden; border-radius: var(--radius);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
      box-shadow: var(--shadow); border: 1px solid var(--border);
    }
    .flashcard-front {
      background: var(--bg-card);
    }
    .flashcard-back {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #fff; transform: rotateY(180deg);
    }
    .flashcard-front h3 { font-size: 1.05rem; margin-bottom: 8px; }
    .flashcard-front .hint { font-size: 0.8rem; color: var(--text-muted); }
    .flashcard-back p { font-size: 0.9rem; line-height: 1.6; }
    .flashcard-num {
      position: absolute; top: 12px; left: 16px;
      font-size: 0.75rem; font-weight: 700; color: var(--text-muted);
    }
    .flashcard-difficulty {
      position: absolute; bottom: 12px; right: 16px;
      font-size: 0.7rem; padding: 2px 8px; border-radius: 10px;
      background: var(--warning); color: #333;
    }

    /* ===== Quiz ===== */
    .quiz-container { max-width: 700px; margin: 0 auto; }
    .quiz-progress {
      display: flex; align-items: center; gap: 12px; margin-bottom: 32px;
    }
    .quiz-progress-bar-wrap {
      flex: 1; height: 8px; background: var(--border); border-radius: 4px;
    }
    .quiz-progress-bar {
      height: 100%; background: var(--accent); border-radius: 4px;
      transition: width 0.4s ease;
    }
    .quiz-progress-text { font-size: 0.9rem; font-weight: 600; color: var(--accent); }
    .quiz-question {
      background: var(--bg-card); border-radius: var(--radius);
      padding: 32px; box-shadow: var(--shadow); margin-bottom: 20px;
    }
    .quiz-question h3 { font-size: 1.15rem; margin-bottom: 20px; line-height: 1.6; }
    .quiz-options { display: flex; flex-direction: column; gap: 12px; }
    .quiz-option {
      padding: 14px 20px; border: 2px solid var(--border); border-radius: var(--radius-sm);
      cursor: pointer; transition: all var(--transition); font-size: 0.95rem;
      display: flex; align-items: center; gap: 12px;
    }
    .quiz-option:hover { border-color: var(--accent); background: rgba(108,92,231,0.05); }
    .quiz-option.selected { border-color: var(--accent); background: rgba(108,92,231,0.1); }
    .quiz-option.correct { border-color: var(--success); background: rgba(0,184,148,0.1); }
    .quiz-option.wrong { border-color: var(--danger); background: rgba(225,112,85,0.1); }
    .quiz-option-letter {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--bg-primary); display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-weight: 600; flex-shrink: 0;
    }
    .quiz-option.correct .quiz-option-letter { background: var(--success); color: #fff; }
    .quiz-option.wrong .quiz-option-letter { background: var(--danger); color: #fff; }
    .quiz-explanation {
      margin-top: 16px; padding: 16px; border-radius: var(--radius-sm);
      background: rgba(108,92,231,0.08); font-size: 0.9rem; color: var(--text-secondary);
      display: none;
    }
    .quiz-explanation.show { display: block; }
    .quiz-nav {
      display: flex; justify-content: space-between; gap: 12px;
    }
    .btn {
      padding: 12px 28px; border-radius: var(--radius-sm); border: none;
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
      transition: all var(--transition);
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-dark); }
    .btn-secondary { background: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--bg-secondary); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .quiz-result {
      text-align: center; padding: 40px;
      background: var(--bg-card); border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .quiz-result .score { font-size: 3rem; font-weight: 800; color: var(--accent); }
    .quiz-result .score-label { color: var(--text-muted); margin-bottom: 24px; }
    .quiz-result-details { margin: 24px 0; text-align: left; }
    .quiz-result-item {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 0; border-bottom: 1px solid var(--border);
    }
    .quiz-result-icon { font-size: 1.2rem; flex-shrink: 0; margin-top: 2px; }

    /* ===== Dashboard ===== */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }
    .dash-card {
      background: var(--bg-card); border-radius: var(--radius);
      border: 1px solid var(--border); padding: 24px;
      box-shadow: var(--shadow);
    }
    .dash-card h3 {
      font-size: 1rem; color: var(--text-muted); margin-bottom: 16px;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .dash-stat { text-align: center; padding: 16px 0; }
    .dash-stat .value { font-size: 2.5rem; font-weight: 800; color: var(--accent); }
    .dash-stat .unit { font-size: 1rem; color: var(--text-muted); }
    .pie-chart {
      width: 180px; height: 180px; border-radius: 50%; margin: 0 auto 16px;
      position: relative;
    }
    .pie-legend {
      display: flex; justify-content: center; gap: 24px; font-size: 0.85rem;
    }
    .pie-legend-item { display: flex; align-items: center; gap: 6px; }
    .pie-legend-dot {
      width: 10px; height: 10px; border-radius: 50%;
    }
    .progress-table {
      width: 100%; border-collapse: collapse; font-size: 0.85rem;
    }
    .progress-table th, .progress-table td {
      padding: 10px 12px; text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .progress-table th {
      color: var(--text-muted); font-weight: 600; font-size: 0.8rem;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .progress-table td { color: var(--text-secondary); }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 0.75rem; font-weight: 600;
    }
    .badge-success { background: rgba(0,184,148,0.15); color: var(--success); }
    .badge-warning { background: rgba(253,203,110,0.2); color: #d4a017; }
    .badge-danger { background: rgba(225,112,85,0.15); color: var(--danger); }
    .weakness-list { list-style: none; }
    .weakness-list li {
      padding: 10px 0; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .weakness-list li:last-child { border: none; }
    .weakness-topic { font-size: 0.9rem; }
    .weakness-score { font-size: 0.85rem; font-weight: 600; }

    /* ===== Chapter Content ===== */
    .chapter-content {
      background: var(--bg-card); border-radius: var(--radius);
      padding: 32px; box-shadow: var(--shadow); margin-bottom: 24px;
    }
    .chapter-content h2 {
      font-size: 1.5rem; margin-bottom: 16px;
      display: flex; align-items: center; gap: 10px;
    }
    .chapter-content h3 { color: var(--accent); margin: 20px 0 10px; font-size: 1.1rem; }
    .chapter-content p { color: var(--text-secondary); margin-bottom: 12px; }
    .chapter-content ul { padding-left: 24px; color: var(--text-secondary); margin-bottom: 12px; }
    .chapter-content li { margin-bottom: 6px; }
    .keyword-link {
      color: var(--accent); cursor: pointer; border-bottom: 1px dashed var(--accent);
      transition: all var(--transition);
    }
    .keyword-link:hover { border-bottom-style: solid; }
    .info-box {
      background: linear-gradient(135deg, rgba(108,92,231,0.08), rgba(162,155,254,0.08));
      border-left: 4px solid var(--accent); padding: 16px 20px;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      margin: 16px 0; font-size: 0.9rem; color: var(--text-secondary);
    }
    .chapter-check {
      display: flex; align-items: center; gap: 10px; margin-top: 20px;
      padding: 16px; background: var(--bg-primary); border-radius: var(--radius-sm);
    }
    .chapter-check input[type="checkbox"] {
      width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer;
    }
    .chapter-check label { cursor: pointer; font-size: 0.95rem; }

    /* ===== Page tabs ===== */
    .page-tabs {
      display: flex; gap: 8px; margin-bottom: 32px; flex-wrap: wrap;
    }
    .page-tab {
      padding: 8px 20px; border-radius: 20px; border: 1px solid var(--border);
      background: var(--bg-card); cursor: pointer; font-size: 0.9rem;
      transition: all var(--transition); font-weight: 500;
    }
    .page-tab:hover, .page-tab.active {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }

    /* ===== Footer ===== */
    .footer {
      text-align: center; padding: 40px 24px;
      color: var(--text-muted); font-size: 0.85rem;
      border-top: 1px solid var(--border); margin-top: 40px;
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .hero h1 { font-size: 2rem; }
      .navbar-links { display: none; flex-direction: column; position: absolute;
        top: 64px; left: 0; right: 0; background: var(--bg-nav);
        padding: 16px; border-bottom: 1px solid var(--border);
        backdrop-filter: blur(20px);
      }
      .navbar-links.open { display: flex; }
      .hamburger { display: block; }
      .card-grid, .flashcard-grid, .dashboard-grid {
        grid-template-columns: 1fr;
      }
      .chapter-content { padding: 20px; }
      .modal { padding: 20px; }
      .hero-stats { gap: 20px; }
    }
    @media (max-width: 480px) {
      .page { padding: 76px 16px 24px; }
      .hero h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

  <!-- ===== Navigation ===== -->
  <nav class="navbar">
    <div class="navbar-inner">
      <div class="navbar-brand"><span>🤖</span> GenAI 複習</div>
      <ul class="navbar-links" id="navLinks">
        <li><a href="#" data-page="overview" class="active">概覽</a></li>
        <li><a href="#" data-page="chapters">課程內容</a></li>
        <li><a href="#" data-page="flashcards">溫習卡片</a></li>
        <li><a href="#" data-page="quiz">測驗與儀表板</a></li>
      </ul>
      <div class="nav-controls">
        <button class="search-toggle" onclick="toggleSearch()" title="搜尋">🔍</button>
        <button class="theme-toggle" onclick="toggleTheme()" title="夜間模式" id="themeBtn">🌙</button>
        <button class="hamburger" onclick="toggleMobileNav()">☰</button>
      </div>
    </div>
  </nav>

  <!-- ===== Search Overlay ===== -->
  <div class="search-overlay" id="searchOverlay" onclick="if(event.target===this)closeSearch()">
    <div class="search-box">
      <div class="search-input-wrap">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="搜尋關鍵字..." oninput="performSearch(this.value)">
        <button onclick="closeSearch()" style="background:none;border:none;font-size:1.2rem;cursor:pointer">✕</button>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <!-- ===== Modal ===== -->

// Search index
const searchIndex = [];
chapters.forEach(ch => {
  ch.sections.forEach(sec => {
    const text = sec.content.replace(/<[^>]*>/g, '');
    searchIndex.push({ title: sec.title, page: 'chapters', chapter: ch.id, text: text.substring(0, 200), fullText: text });
  });
});
flashcardsData.forEach((fc, i) => {
  searchIndex.push({ title: `卡片 ${i+1}: ${fc.front}`, page: 'flashcards', text: fc.front + ' ' + fc.back, fullText: fc.front + ' ' + fc.back });
});
quizData.forEach((q, i) => {
  searchIndex.push({ title: `測驗題 ${i+1}`, page: 'quiz', text: q.q + ' ' + q.explanation, fullText: q.q + ' ' + q.explanation });
});

// ===== STATE =====
let bookmarks = JSON.parse(localStorage.getItem('genai_bookmarks') || '[]');
let progress = JSON.parse(localStorage.getItem('genai_progress') || '{}');
let quizHistory = JSON.parse(localStorage.getItem('genai_quiz_history') || '[]');
let currentQuizQuestion = 0;
let quizAnswers = [];
let quizSubmitted = false;

// ===== NAVIGATION =====
function switchPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('.navbar-links a').forEach(a => {
    a.classList.toggle('active', a.dataset.page === page);
  });
  document.getElementById('navLinks').classList.remove('open');
  window.scrollTo(0, 0);
}
document.querySelectorAll('.navbar-links a').forEach(a => {
  a.addEventListener('click', e => { e.preventDefault(); switchPage(a.dataset.page); });
});
function toggleMobileNav() {
  document.getElementById('navLinks').classList.toggle('open');
}

// ===== THEME =====
function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', isDark ? '' : 'dark');
  document.getElementById('themeBtn').textContent = isDark ? '🌙' : '☀️';
  localStorage.setItem('genai_theme', isDark ? 'light' : 'dark');
}
if (localStorage.getItem('genai_theme') === 'dark') { toggleTheme(); }

// ===== SEARCH =====
function toggleSearch() {
  const overlay = document.getElementById('searchOverlay');
  overlay.classList.toggle('active');
  if (overlay.classList.contains('active')) {
    setTimeout(() => document.getElementById('searchInput').focus(), 100);
  }
}
function closeSearch() {
  document.getElementById('searchOverlay').classList.remove('active');
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').innerHTML = '';
}
function performSearch(query) {
  const results = document.getElementById('searchResults');
  if (!query.trim()) { results.innerHTML = ''; return; }
  const q = query.toLowerCase();
  const matches = searchIndex.filter(item =>
    item.title.toLowerCase().includes(q) || item.fullText.toLowerCase().includes(q)
  ).slice(0, 10);
  results.innerHTML = matches.length ? matches.map(m => `
    <div class="search-result-item" onclick="closeSearch();navigateToResult('${m.page}','${m.chapter||''}')">
      <h4>${highlightText(m.title, query)}</h4>
      <p>${highlightText(m.text.substring(0, 120), query)}...</p>
    </div>
  `).join('') : '<p style="padding:16px;color:var(--text-muted);">沒有找到相關結果</p>';
}
function highlightText(text, query) {
  if (!query) return text;
  const re = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return text.replace(re, '<span class="search-highlight">$1</span>');
}
function navigateToResult(page, chapter) {
  switchPage(page);
  if (chapter && page === 'chapters') {
    setTimeout(() => {
      const tab = document.querySelector(`.page-tab[data-chapter="${chapter}"]`);
      if (tab) tab.click();
    }, 100);
  }
}
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); toggleSearch(); }
  if (e.key === 'Escape') { closeSearch(); closeModal(); }
});

// ===== MODAL =====
function openModal(keyword) {
  const detail = keywordDetails[keyword];
  if (!detail) return;
  document.getElementById('modalTitle').textContent = detail.title;
  document.getElementById('modalBody').innerHTML = detail.body;
  document.getElementById('modalOverlay').classList.add('active');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}
// Delegate keyword link clicks
document.addEventListener('click', e => {
  if (e.target.classList.contains('keyword-link')) {
    openModal(e.target.dataset.keyword);
  }
});

// ===== OVERVIEW PAGE =====
function renderOverviewCards() {
  const grid = document.getElementById('overviewCards');
  grid.innerHTML = chapters.map(ch => {
    const prog = getChapterProgress(ch.id);
    const isBookmarked = bookmarks.includes(ch.id);
    return `
      <div class="card" onclick="switchPage('chapters');setTimeout(()=>{document.querySelector('.page-tab[data-chapter=${ch.id}]').click()},100)">
        <button class="card-bookmark ${isBookmarked?'bookmarked':''}" onclick="event.stopPropagation();toggleBookmark('${ch.id}',this)" title="收藏">🔖</button>
        <span class="card-tag">${ch.tag}</span>
        <h3>${ch.icon} ${ch.title}</h3>
        <p>${ch.desc}</p>
        <div class="card-progress"><div class="card-progress-bar" style="width:${prog}%"></div></div>
        <div style="margin-top:8px;font-size:0.8rem;color:var(--text-muted)">完成度 ${prog}%</div>
      </div>`;
  }).join('');
  updateBookmarkedItems();
}

function getChapterProgress(chId) {
  const ch = chapters.find(c => c.id === chId);
  if (!ch) return 0;
  const total = ch.sections.length;
  const done = ch.sections.filter((_, i) => progress[`${chId}_${i}`]).length;
  return Math.round((done / total) * 100);
}

function updateOverallProgress() {
  let total = 0, done = 0;
  chapters.forEach(ch => {
    total += ch.sections.length;
    ch.sections.forEach((_, i) => { if (progress[`${ch.id}_${i}`]) done++; });
  });
  document.getElementById('heroProgress').textContent = Math.round((done/total)*100) + '%';
}

// ===== BOOKMARKS =====
function toggleBookmark(id, btn) {
  const idx = bookmarks.indexOf(id);
  if (idx > -1) { bookmarks.splice(idx, 1); btn.classList.remove('bookmarked'); }
  else { bookmarks.push(id); btn.classList.add('bookmarked'); }
  localStorage.setItem('genai_bookmarks', JSON.stringify(bookmarks));
  updateBookmarkedItems();
}
function updateBookmarkedItems() {
  const container = document.getElementById('bookmarkedItems');
  if (!bookmarks.length) {
    container.innerHTML = '<span style="color:var(--text-muted);font-size:0.9rem;">尚未收藏任何內容</span>';
    return;
  }
  container.innerHTML = bookmarks.map(id => {
    const ch = chapters.find(c => c.id === id);
    return ch ? `<div style="display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:20px;margin:4px;font-size:0.85rem;cursor:pointer" onclick="switchPage('chapters');setTimeout(()=>{document.querySelector('.page-tab[data-chapter=${id}]').click()},100)">🔖 ${ch.icon} ${ch.title}</div>` : '';
  }).join('');
}

// ===== CHAPTERS PAGE =====
function renderChapterTabs() {
  const tabs = document.getElementById('chapterTabs');
  tabs.innerHTML = chapters.map((ch, i) =>
    `<div class="page-tab ${i===0?'active':''}" data-chapter="${ch.id}" onclick="selectChapter('${ch.id}',this)">${ch.icon} ${ch.title}</div>`
  ).join('');
}
function selectChapter(chId, tabEl) {
  document.querySelectorAll('#chapterTabs .page-tab').forEach(t => t.classList.remove('active'));
  tabEl.classList.add('active');
  renderChapterContent(chId);
}
function renderChapterContent(chId) {
  const ch = chapters.find(c => c.id === chId);
  const container = document.getElementById('chapterContent');
  container.innerHTML = ch.sections.map((sec, i) => {
    const checked = progress[`${chId}_${i}`] ? 'checked' : '';
    return `
      <div class="chapter-content">
        <h2>${sec.title}</h2>
        ${sec.content}
        <div class="chapter-check">
          <input type="checkbox" id="chk_${chId}_${i}" ${checked} onchange="toggleProgress('${chId}',${i},this.checked)">
          <label for="chk_${chId}_${i}">✅ 已閱讀此章節</label>
        </div>
      </div>`;
  }).join('');
}
function toggleProgress(chId, secIdx, checked) {
  progress[`${chId}_${secIdx}`] = checked;
  if (!checked) delete progress[`${chId}_${secIdx}`];
  localStorage.setItem('genai_progress', JSON.stringify(progress));
  updateOverallProgress();
  renderOverviewCards();
}

// ===== FLASHCARDS =====
function renderFlashcards() {
  const grid = document.getElementById('flashcardGrid');
  grid.innerHTML = flashcardsData.map((fc, i) => `
    <div class="flashcard-wrapper">
      <div class="flashcard" onclick="this.classList.toggle('flipped')">
        <div class="flashcard-front">
          <div class="flashcard-num">#${i+1}</div>
          <h3>${fc.front}</h3>
          <div class="hint">點擊翻轉查看答案</div>
          <div class="flashcard-difficulty">${fc.difficulty}</div>
        </div>
        <div class="flashcard-back">
          <p>${fc.back}</p>
        </div>
      </div>
    </div>
  `).join('');
}

// ===== QUIZ =====
function renderQuiz() {
  currentQuizQuestion = 0;
  quizAnswers = new Array(quizData.length).fill(-1);
  quizSubmitted = false;
  renderQuizQuestion();
}
function renderQuizQuestion() {
  const container = document.getElementById('quizContainer');
  if (quizSubmitted) {
    renderQuizResult();
    return;
  }
  const q = quizData[currentQuizQuestion];
  const letters = ['A','B','C','D'];
  container.innerHTML = `
    <div class="quiz-progress">
      <div class="quiz-progress-bar-wrap"><div class="quiz-progress-bar" style="width:${((currentQuizQuestion+1)/quizData.length)*100}%"></div></div>
      <div class="quiz-progress-text">${currentQuizQuestion+1} / ${quizData.length}</div>
    </div>
    <div class="quiz-question">
      <h3>第 ${currentQuizQuestion+1} 題：${q.q}</h3>
      <div class="quiz-options">
        ${q.options.map((opt, i) => `
          <div class="quiz-option ${quizAnswers[currentQuizQuestion]===i?'selected':''}" onclick="selectQuizOption(${i})">
            <span class="quiz-option-letter">${letters[i]}</span>
            <span>${opt}</span>
          </div>
        `).join('')}
      </div>
      <div class="quiz-explanation" id="quizExplanation">${q.explanation}</div>
    </div>
    <div class="quiz-nav">
      <button class="btn btn-secondary" ${currentQuizQuestion===0?'disabled':''} onclick="prevQuizQuestion()">← 上一題</button>
      ${currentQuizQuestion === quizData.length - 1
        ? '<button class="btn btn-primary" onclick="submitQuiz()">提交測驗 📊</button>'
        : '<button class="btn btn-primary" onclick="nextQuizQuestion()">下一題 →</button>'}
    </div>`;
}
function selectQuizOption(idx) {
  if (quizSubmitted) return;
  quizAnswers[currentQuizQuestion] = idx;
  const q = quizData[currentQuizQuestion];
  document.querySelectorAll('.quiz-option').forEach((el, i) => {
    el.classList.remove('selected', 'correct', 'wrong');
    if (i === idx) el.classList.add('selected');
  });
  // Show correct/wrong
  setTimeout(() => {
    document.querySelectorAll('.quiz-option').forEach((el, i) => {
      if (i === q.correct) el.classList.add('correct');
      if (i === idx && i !== q.correct) el.classList.add('wrong');
    });
    document.getElementById('quizExplanation').classList.add('show');
  }, 300);
}
function nextQuizQuestion() {
  if (currentQuizQuestion < quizData.length - 1) {
    currentQuizQuestion++;
    renderQuizQuestion();
  }
}
function prevQuizQuestion() {
  if (currentQuizQuestion > 0) {
    currentQuizQuestion--;
    renderQuizQuestion();
  }
}
function submitQuiz() {
  quizSubmitted = true;
  let score = 0;
  quizAnswers.forEach((a, i) => { if (a === quizData[i].correct) score++; });
  quizHistory.push({
    date: new Date().toLocaleDateString('zh-HK'),
    score,
    total: quizData.length,
    answers: [...quizAnswers]
  });
  localStorage.setItem('genai_quiz_history', JSON.stringify(quizHistory));
  renderQuizResult();
}
function renderQuizResult() {
  const container = document.getElementById('quizContainer');
  let score = 0;
  quizAnswers.forEach((a, i) => { if (a === quizData[i].correct) score++; });
  const letters = ['A','B','C','D'];
  container.innerHTML = `
    <div class="quiz-result">
      <div class="score">${score}/${quizData.length}</div>
      <div class="score-label">測驗得分</div>
      <p style="color:var(--text-secondary);margin-bottom:16px">${score >= 8 ? '🎉 表現優秀！' : score >= 6 ? '👍 不錯！繼續努力！' : '💪 需要加強複習！'}</p>
      <div class="quiz-result-details">
        ${quizData.map((q, i) => {
          const correct = quizAnswers[i] === q.correct;
          return `<div class="quiz-result-item">
            <span class="quiz-result-icon">${correct ? '✅' : '❌'}</span>
            <div><strong>第${i+1}題：</strong>${q.q}<br><span style="font-size:0.85rem;color:var(--text-muted)">你的答案：${quizAnswers[i]>=0?letters[quizAnswers[i]]+'. '+q.options[quizAnswers[i]]:'未作答'} | 正確答案：${letters[q.correct]}. ${q.options[q.correct]}</span></div>
          </div>`;
        }).join('')}
      </div>
      <button class="btn btn-primary" onclick="renderQuiz()" style="margin-top:20px;">重新測驗 🔄</button>
    </div>`;
}

// ===== QUIZ TABS =====
function switchQuizTab(tab) {
  document.querySelectorAll('#page-quiz .page-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('quizTab').style.display = tab === 'quizTab' ? 'block' : 'none';
  document.getElementById('dashTab').style.display = tab === 'dashTab' ? 'block' : 'none';
  if (tab === 'dashTab') renderDashboard();
}

// ===== DASHBOARD =====
function renderDashboard() {
  const grid = document.getElementById('dashboardGrid');
  // Calculate stats
  const totalAttempts = quizHistory.length;
  let totalCorrect = 0, totalQuestions = 0;
  quizHistory.forEach(h => { totalCorrect += h.score; totalQuestions += h.total; });
  const overallAccuracy = totalQuestions ? Math.round((totalCorrect/totalQuestions)*100) : 0;

  // Per-question stats
  const qStats = quizData.map((q, i) => {
    let correct = 0, attempts = 0;
    quizHistory.forEach(h => {
      if (h.answers[i] !== undefined && h.answers[i] !== -1) {
        attempts++;
        if (h.answers[i] === q.correct) correct++;
      }
    });
    return { idx: i+1, question: q.q.substring(0, 40) + '...', correct, attempts, rate: attempts ? Math.round((correct/attempts)*100) : 0 };
  });

  // Weaknesses
  const weaknesses = qStats.filter(q => q.rate < 60 && q.attempts > 0).sort((a,b) => a.rate - b.rate);

  // Pie chart gradient
  const correctPct = overallAccuracy;
  const wrongPct = 100 - correctPct;

  // Chapter progress
  const chProgress = chapters.map(ch => ({
    title: ch.title,
    progress: getChapterProgress(ch.id)
  }));

  grid.innerHTML = `
    <div class="dash-card">
      <h3>總體準確率</h3>
      <div class="dash-stat">
        <div class="pie-chart" style="background: conic-gradient(var(--success) 0% ${correctPct}%, var(--danger) ${correctPct}% 100%);"></div>
        <div class="pie-legend">
          <div class="pie-legend-item"><div class="pie-legend-dot" style="background:var(--success)"></div> 正確 ${correctPct}%</div>
          <div class="pie-legend-item"><div class="pie-legend-dot" style="background:var(--danger)"></div> 錯誤 ${wrongPct}%</div>
        </div>
      </div>
    </div>

    <div class="dash-card">
      <h3>學習統計</h3>
      <div class="dash-stat">
        <div class="value">${totalAttempts}</div>
        <div class="unit">測驗次數</div>
      </div>
      <div style="display:flex;justify-content:space-around;margin-top:16px;">
        <div style="text-align:center"><div style="font-size:1.5rem;font-weight:700;color:var(--success)">${totalCorrect}</div><div style="font-size:0.8rem;color:var(--text-muted)">答對</div></div>
        <div style="text-align:center"><div style="font-size:1.5rem;font-weight:700;color:var(--danger)">${totalQuestions - totalCorrect}</div><div style="font-size:0.8rem;color:var(--text-muted)">答錯</div></div>
      </div>
    </div>

    <div class="dash-card">
      <h3>章節進度</h3>
      ${chProgress.map(ch => `
        <div style="margin-bottom:14px;">
          <div style="display:flex;justify-content:space-between;font-size:0.85rem;margin-bottom:4px;">
            <span>${ch.title}</span><span style="color:var(--accent);font-weight:600">${ch.progress}%</span>
          </div>
          <div class="card-progress"><div class="card-progress-bar" style="width:${ch.progress}%"></div></div>
        </div>
      `).join('')}
    </div>

    <div class="dash-card" style="grid-column:1/-1;">
      <h3>各題答題表現</h3>
      ${totalAttempts ? `
        <div style="overflow-x:auto;">
          <table class="progress-table">
            <thead><tr><th>題號</th><th>題目</th><th>答對次數</th><th>作答次數</th><th>正確率</th><th>表現</th></tr></thead>
            <tbody>
              ${qStats.map(q => `<tr>
                <td>${q.idx}</td>
                <td>${q.question}</td>
                <td>${q.correct}</td>
                <td>${q.attempts}</td>
                <td>${q.rate}%</td>
                <td><span class="badge ${q.rate>=80?'badge-success':q.rate>=50?'badge-warning':'badge-danger'}">${q.rate>=80?'良好':q.rate>=50?'一般':'需加強'}</span></td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      ` : '<p style="color:var(--text-muted);padding:20px 0;text-align:center;">尚未有測驗記錄，完成測驗後即可查看表現分析</p>'}
    </div>

    <div class="dash-card">
      <h3>弱點分析</h3>
      ${weaknesses.length ? `
        <ul class="weakness-list">
          ${weaknesses.map(w => `<li>
            <span class="weakness-topic">第${w.idx}題</span>
            <span class="weakness-score" style="color:var(--danger)">${w.rate}%</span>
          </li>`).join('')}
        </ul>
      ` : '<p style="color:var(--text-muted);text-align:center;padding:20px 0;">暫無弱點，繼續保持！</p>'}
    </div>

    <div class="dash-card">
      <h3>測驗歷史</h3>
      ${totalAttempts ? `
        <table class="progress-table">
          <thead><tr><th>日期</th><th>得分</th><th>正確率</th></tr></thead>
          <tbody>
            ${quizHistory.slice(-10).reverse().map(h => `<tr>
              <td>${h.date}</td>
              <td>${h.score}/${h.total}</td>
              <td>${Math.round((h.score/h.total)*100)}%</td>
            </tr>`).join('')}
          </tbody>
        </table>
      ` : '<p style="color:var(--text-muted);text-align:center;padding:20px 0;">尚未有測驗記錄</p>'}
    </div>
  `;
}

// ===== INIT =====
function init() {
  renderOverviewCards();
  renderChapterTabs();
  renderChapterContent(chapters[0].id);
  renderFlashcards();
  renderQuiz();
  updateOverallProgress();
}
init();
</script>
