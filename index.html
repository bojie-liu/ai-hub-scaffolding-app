<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生成式AI教學動畫 — 大型語言模型文本生成過程</title>
  <style>
    /* ===== Reset & Base ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface2: #334155;
      --accent: #38bdf8;
      --accent2: #818cf8;
      --accent3: #a78bfa;
      --accent4: #f472b6;
      --text: #f1f5f9;
      --text2: #94a3b8;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --radius: 12px;
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ===== Header ===== */
    .header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 1px solid var(--surface2);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .header-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .header-text h1 {
      font-size: 18px; font-weight: 700;
      background: linear-gradient(90deg, var(--accent), var(--accent3));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .header-text p { font-size: 13px; color: var(--text2); margin-top: 2px; }
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--surface2); border-radius: 20px;
      padding: 4px 12px; font-size: 12px; color: var(--accent);
    }

    /* ===== Main Layout ===== */
    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 260px 1fr 280px;
      gap: 0;
      min-height: 0;
    }
    @media (max-width: 1100px) {
      .main { grid-template-columns: 1fr; }
      .sidebar-left, .sidebar-right { display: none; }
    }

    /* ===== Left Sidebar: Steps ===== */
    .sidebar-left {
      background: var(--surface);
      border-right: 1px solid var(--surface2);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
    }
    .sidebar-left h2 {
      font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px;
      color: var(--text2); margin-bottom: 8px;
    }
    .step-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 12px; border-radius: 8px;
      cursor: pointer; transition: all .25s;
      border: 1px solid transparent;
    }
    .step-item:hover { background: var(--surface2); }
    .step-item.active {
      background: rgba(56,189,248,0.1);
      border-color: var(--accent);
    }
    .step-item.completed .step-num { background: var(--success); color: var(--bg); }
    .step-num {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--surface2); color: var(--text2);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; flex-shrink: 0;
      transition: all .25s;
    }
    .step-item.active .step-num { background: var(--accent); color: var(--bg); }
    .step-title { font-size: 13px; font-weight: 600; line-height: 1.3; }
    .step-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }

    /* ===== Center: Animation Canvas ===== */
    .canvas-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(56,189,248,0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 50%, rgba(167,139,250,0.06) 0%, transparent 60%),
        var(--bg);
    }

    .anim-container {
      width: 100%;
      max-width: 680px;
      position: relative;
    }

    /* ===== Animation Elements ===== */
    .anim-stage {
      width: 100%;
      aspect-ratio: 16/10;
      background: var(--surface);
      border: 1px solid var(--surface2);
      border-radius: var(--radius);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Particle background */
    .particles {
      position: absolute; inset: 0;
      overflow: hidden; pointer-events: none;
    }
    .particle {
      position: absolute;
      width: 3px; height: 3px;
      background: var(--accent);
      border-radius: 50%;
      opacity: 0.3;
      animation: float linear infinite;
    }
    @keyframes float {
      0% { transform: translateY(0) translateX(0); opacity: 0.3; }
      50% { opacity: 0.6; }
      100% { transform: translateY(-100px) translateX(30px); opacity: 0; }
    }

    /* Step-specific animation styles */
    .anim-content {
      position: relative; z-index: 2;
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
      padding: 20px;
    }
    .anim-content.hidden { display: none; }

    /* -- Tokens -- */
    .token-row {
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    }
    .token {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 8px 16px; border-radius: 8px;
      font-size: 15px; font-weight: 600;
      border: 2px solid transparent;
      opacity: 0; transform: scale(0.5);
      transition: all .4s cubic-bezier(0.34,1.56,0.64,1);
    }
    .token.show { opacity: 1; transform: scale(1); }
    .token-input { background: rgba(56,189,248,0.15); border-color: var(--accent); color: var(--accent); }
    .token-embed { background: rgba(129,140,248,0.15); border-color: var(--accent2); color: var(--accent2); }
    .token-attn { background: rgba(167,139,250,0.15); border-color: var(--accent3); color: var(--accent3); }
    .token-out { background: rgba(244,114,182,0.15); border-color: var(--accent4); color: var(--accent4); }
    .token-gen { background: rgba(52,211,153,0.15); border-color: var(--success); color: var(--success); }

    .token-id {
      font-size: 10px; opacity: 0.6; margin-left: 6px;
      font-family: 'Courier New', monospace;
    }

    /* -- Arrows -- */
    .arrow-down {
      width: 2px; height: 30px;
      background: var(--text2);
      position: relative;
      margin: 8px auto;
      opacity: 0;
      transition: opacity .4s;
    }
    .arrow-down.show { opacity: 1; }
    .arrow-down::after {
      content: '';
      position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid var(--text2);
    }

    /* -- Block (Transformer layer) -- */
    .block-row {
      display: flex; gap: 12px; align-items: center; justify-content: center;
      flex-wrap: wrap;
    }
    .block {
      width: 140px; height: 70px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
      font-size: 12px; font-weight: 600;
      border: 2px solid;
      opacity: 0; transform: translateY(20px);
      transition: all .5s cubic-bezier(0.34,1.56,0.64,1);
    }
    .block.show { opacity: 1; transform: translateY(0); }
    .block-label { font-size: 11px; margin-top: 4px; opacity: 0.7; }
    .block-attn { background: rgba(167,139,250,0.12); border-color: var(--accent3); color: var(--accent3); }
    .block-ffn { background: rgba(244,114,182,0.12); border-color: var(--accent4); color: var(--accent4); }
    .block-norm { background: rgba(56,189,248,0.12); border-color: var(--accent); color: var(--accent); }
    .block-embed { background: rgba(129,140,248,0.12); border-color: var(--accent2); color: var(--accent2); }

    /* -- Attention lines -- */
    .attn-svg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    .attn-line {
      stroke: var(--accent3);
      stroke-width: 1.5;
      fill: none;
      opacity: 0;
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      transition: all .8s;
    }
    .attn-line.show {
      opacity: 0.6;
      stroke-dashoffset: 0;
    }

    /* -- Probability bars -- */
    .prob-container {
      display: flex; flex-direction: column; gap: 8px;
      width: 100%; max-width: 400px;
    }
    .prob-row {
      display: flex; align-items: center; gap: 10px;
      opacity: 0; transform: translateX(-20px);
      transition: all .4s;
    }
    .prob-row.show { opacity: 1; transform: translateX(0); }
    .prob-label { width: 50px; text-align: right; font-size: 14px; font-weight: 600; color: var(--text); }
    .prob-bar-bg {
      flex: 1; height: 24px;
      background: var(--surface2);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    .prob-bar {
      height: 100%;
      border-radius: 6px;
      width: 0;
      transition: width .8s cubic-bezier(0.34,1.56,0.64,1);
    }
    .prob-val {
      width: 50px; font-size: 13px; font-weight: 600;
      font-family: 'Courier New', monospace;
    }
    .prob-row.selected .prob-label { color: var(--success); }
    .prob-row.selected .prob-bar { background: linear-gradient(90deg, var(--success), #6ee7b7) !important; }

    /* -- Autoregressive loop -- */
    .loop-container {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .loop-step {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0; transform: scale(0.9);
      transition: all .4s;
    }
    .loop-step.show { opacity: 1; transform: scale(1); }
    .loop-step.loop-active {
      background: rgba(56,189,248,0.15);
      border: 1px solid var(--accent);
    }
    .loop-arrow {
      font-size: 20px; color: var(--accent);
      opacity: 0; transition: opacity .3s;
    }
    .loop-arrow.show { opacity: 1; }
    .generated-text {
      font-size: 16px;
      padding: 10px 20px;
      border-radius: 8px;
      background: rgba(52,211,153,0.1);
      border: 1px solid var(--success);
      color: var(--success);
      font-weight: 600;
      margin-top: 8px;
      min-height: 42px;
      transition: all .3s;
    }
    .cursor-blink {
      display: inline-block;
      width: 2px; height: 18px;
      background: var(--success);
      margin-left: 2px;
      animation: blink 1s step-end infinite;
      vertical-align: middle;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* -- Summary view -- */
    .summary-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; width: 100%;
    }
    .summary-card {
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--surface2);
      background: var(--surface);
      opacity: 0; transform: translateY(15px);
      transition: all .5s;
    }
    .summary-card.show { opacity: 1; transform: translateY(0); }
    .summary-card h3 { font-size: 13px; color: var(--accent); margin-bottom: 6px; }
    .summary-card p { font-size: 12px; color: var(--text2); line-height: 1.5; }

    /* ===== Right Sidebar: Explanation ===== */
    .sidebar-right {
      background: var(--surface);
      border-left: 1px solid var(--surface2);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .sidebar-right h2 {
      font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px;
      color: var(--text2); margin-bottom: 12px;
    }
    .explanation-box {
      background: var(--bg);
      border: 1px solid var(--surface2);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .explanation-box h3 {
      font-size: 15px; font-weight: 700;
      margin-bottom: 8px;
      color: var(--accent);
    }
    .explanation-box p {
      font-size: 13px; line-height: 1.7;
      color: var(--text2);
    }
    .explanation-box p strong { color: var(--text); }
    .key-point {
      display: flex; gap: 8px; align-items: flex-start;
      padding: 8px 0;
      border-bottom: 1px solid var(--surface2);
    }
    .key-point:last-child { border-bottom: none; }
    .key-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); flex-shrink: 0;
      margin-top: 6px;
    }
    .key-text { font-size: 12px; color: var(--text2); line-height: 1.5; }

    /* ===== Bottom Controls ===== */
    .controls {
      background: var(--surface);
      border-top: 1px solid var(--surface2);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .play-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--bg);
      border: none;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s;
      flex-shrink: 0;
    }
    .play-btn:hover { transform: scale(1.1); background: #7dd3fc; }

    .progress-wrap {
      flex: 1; min-width: 120px;
      display: flex; align-items: center; gap: 10px;
    }
    .progress-bar-bg {
      flex: 1; height: 6px;
      background: var(--surface2);
      border-radius: 3px;
      overflow: hidden;
      cursor: pointer;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent3));
      border-radius: 3px;
      width: 0;
      transition: width .3s;
    }
    .progress-text { font-size: 12px; color: var(--text2); white-space: nowrap; }

    .speed-control {
      display: flex; align-items: center; gap: 6px;
    }
    .speed-label { font-size: 12px; color: var(--text2); }
    .speed-btn {
      padding: 4px 10px;
      border-radius: 6px;
      background: var(--surface2);
      border: 1px solid transparent;
      color: var(--text2);
      font-size: 12px;
      cursor: pointer;
      transition: all .2s;
    }
    .speed-btn:hover { background: #475569; }
    .speed-btn.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }

    .narration-toggle {
      display: flex; align-items: center; gap: 6px;
      margin-left: auto;
    }
    .narration-toggle label {
      font-size: 12px; color: var(--text2); cursor: pointer;
      display: flex; align-items: center; gap: 4px;
    }
    .toggle-switch {
      position: relative;
      width: 36px; height: 20px;
      appearance: none; -webkit-appearance: none;
      background: var(--surface2);
      border-radius: 10px;
      cursor: pointer;
      transition: background .3s;
    }
    .toggle-switch::after {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--text2);
      top: 2px; left: 2px;
      transition: all .3s;
    }
    .toggle-switch:checked { background: var(--accent); }
    .toggle-switch:checked::after {
      left: 18px;
      background: white;
    }

    .step-btn {
      width: 34px; height: 34px;
      border-radius: 8px;
      background: var(--surface2);
      border: none;
      color: var(--text2);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      transition: all .2s;
    }
    .step-btn:hover { background: #475569; color: var(--text); }

    /* ===== Responsive ===== */
    @media (max-width: 1100px) {
      .main { min-height: 60vh; }
      .anim-stage { aspect-ratio: 16/9; }
    }

    /* ===== Animations ===== */
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(56,189,248,0.3); }
      50% { box-shadow: 0 0 20px 4px rgba(56,189,248,0.15); }
    }
    .pulse { animation: pulseGlow 2s ease-in-out infinite; }

    @keyframes slideInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .connector-line {
      stroke: var(--text2);
      stroke-width: 2;
      fill: none;
    }

    /* Flow diagram styles */
    .flow-container {
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; width: 100%;
    }
    .flow-node {
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 13px; font-weight: 600;
      border: 2px solid;
      text-align: center;
      opacity: 0; transform: scale(0.8);
      transition: all .5s cubic-bezier(0.34,1.56,0.64,1);
    }
    .flow-node.show { opacity: 1; transform: scale(1); }
    .flow-node.active-node {
      animation: pulseGlow 2s ease-in-out infinite;
    }
    .flow-arrow {
      font-size: 18px; color: var(--text2);
      opacity: 0; transition: opacity .3s;
    }
    .flow-arrow.show { opacity: 1; }
  </style>
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="header">
    <div class="header-icon">🤖</div>
    <div class="header-text">
      <h1>生成式AI — 大型語言模型文本生成過程</h1>
      <p>Generative AI: How Large Language Models Generate Text</p>
    </div>
    <div class="badge">📚 大學程度</div>
    <div class="badge">🎬 過程演示</div>
  </header>

  <!-- ===== Main ===== -->
  <div class="main">

    <!-- Left: Steps -->
    <aside class="sidebar-left">
      <h2>流程步驟</h2>
      <div id="stepList"></div>
    </aside>

    <!-- Center: Animation -->
    <div class="canvas-area">
      <div class="anim-container">
        <div class="anim-stage" id="animStage">
          <div class="particles" id="particles"></div>
          <div class="anim-content" id="animContent"></div>
        </div>
      </div>
    </div>

    <!-- Right: Explanation -->
    <aside class="sidebar-right">
      <h2>步驟解說</h2>
      <div id="explanationPanel"></div>
    </aside>
  </div>

  <!-- ===== Controls ===== -->
  <div class="controls">
    <button class="step-btn" id="prevBtn" title="上一步">⏮</button>
    <button class="play-btn" id="playBtn" title="播放/暫停">▶</button>
    <button class="step-btn" id="nextBtn" title="下一步">⏭</button>

    <div class="progress-wrap">
      <div class="progress-bar-bg" id="progressBg">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <span class="progress-text" id="progressText">0 / 7</span>
    </div>

    <div class="speed-control">
      <span class="speed-label">速度</span>
      <button class="speed-btn" data-speed="0.5">0.5x</button>
      <button class="speed-btn active" data-speed="1">1x</button>
      <button class="speed-btn" data-speed="1.5">1.5x</button>
      <button class="speed-btn" data-speed="2">2x</button>
    </div>

    <div class="narration-toggle">
      <label>
        🔊 旁白
        <input type="checkbox" class="toggle-switch" id="narrationToggle" checked>
      </label>
    </div>
  </div>

<script>
// ===== DATA: Steps =====
const STEPS = [
  {
    id: 1,
    title: '用戶輸入',
    sub: 'User Input & Tokenization',
    narration: '首先，用戶輸入一段文字提示。系統會將這段文字分割成基本的處理單元，稱為Token。例如「人工智能改變世界」會被分割成「人工」、「智能」、「改變」、「世界」等Token。每個Token都會被賦予一個唯一的數字ID，以便後續處理。',
    explanation: {
      title: '第一步：輸入與分詞',
      desc: '用戶輸入的文字首先經過<strong>分詞器（Tokenizer）</strong>處理，將連續的文字序列切割成離散的Token。這是模型處理自然語言的第一步。',
      points: [
        'Token可以是字、詞或子詞單元，取決於分詞策略',
        'BPE（Byte Pair Encoding）是主流分詞演算法',
        '每個Token映射到詞表中一個唯一的整數ID',
        '特殊Token如 [CLS]、[SEP] 用於標記句子邊界'
      ]
    }
  },
  {
    id: 2,
    title: '詞嵌入',
    sub: 'Token Embedding',
    narration: '每個Token ID接著被轉換成一個高維向量，稱為詞嵌入。這個向量在多維空間中捕捉了詞語的語義信息。語義相近的詞，其向量在空間中的距離也相近。嵌入維度通常為768到4096維。',
    explanation: {
      title: '第二步：詞嵌入',
      desc: '離散的Token ID通過<strong>嵌入矩陣（Embedding Matrix）</strong>映射為連續的稠密向量，使模型能夠捕捉詞語之間的語義關係。',
      points: [
        '嵌入矩陣維度：詞表大小 × 嵌入維度',
        '語義相近的詞在向量空間中距離相近',
        'GPT-3嵌入維度為12288，GPT-2為768',
        '嵌入向量會加上位置編碼（Positional Encoding）'
      ]
    }
  },
  {
    id: 3,

// ===== STATE =====
let currentStep = 0;
let isPlaying = false;
let playSpeed = 1;
let narrationEnabled = true;
let stepTimer = null;
let animTimeouts = [];

// ===== INIT =====
function init() {
  createParticles();
  renderStepList();
  renderStep(0);
  bindEvents();
}

function createParticles() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.top = (40 + Math.random() * 60) + '%';
    p.style.animationDuration = (3 + Math.random() * 4) + 's';
    p.style.animationDelay = Math.random() * 3 + 's';
    p.style.background = ['var(--accent)', 'var(--accent2)', 'var(--accent3)'][Math.floor(Math.random()*3)];
    container.appendChild(p);
  }
}

function renderStepList() {
  const list = document.getElementById('stepList');
  list.innerHTML = STEPS.map((s, i) => `
    <div class="step-item ${i === currentStep ? 'active' : ''} ${i < currentStep ? 'completed' : ''}" data-idx="${i}">
      <div class="step-num">${i < currentStep ? '✓' : s.id}</div>
      <div>
        <div class="step-title">${s.title}</div>
        <div class="step-sub">${s.sub}</div>
      </div>
    </div>
  `).join('');

  list.querySelectorAll('.step-item').forEach(el => {
    el.addEventListener('click', () => goToStep(parseInt(el.dataset.idx)));
  });
}

function renderExplanation(stepIdx) {
  const s = STEPS[stepIdx];
  const panel = document.getElementById('explanationPanel');
  panel.innerHTML = `
    <div class="explanation-box">
      <h3>${s.explanation.title}</h3>
      <p>${s.explanation.desc}</p>
    </div>
    <h2 style="font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text2);margin-bottom:8px;">關鍵要點</h2>
    ${s.explanation.points.map(p => `
      <div class="key-point">
        <div class="key-dot"></div>
        <div class="key-text">${p}</div>
      </div>
    `).join('')}
  `;
}

// ===== STEP ANIMATIONS =====
function renderStep(idx) {
  currentStep = idx;
  clearAnimTimeouts();
  renderStepList();
  renderExplanation(idx);
  updateProgress();
  updatePlayBtn();

  const content = document.getElementById('animContent');
  content.innerHTML = '';
  content.className = 'anim-content';

  switch(idx) {
    case 0: animStep1(content); break;
    case 1: animStep2(content); break;
    case 2: animStep3(content); break;
    case 3: animStep4(content); break;
    case 4: animStep5(content); break;
    case 5: animStep6(content); break;
    case 6: animStep7(content); break;
  }

  if (narrationEnabled) speak(STEPS[idx].narration);
  if (isPlaying) scheduleNext();
}

function addTimeout(fn, ms) {
  const t = setTimeout(fn, ms / playSpeed);
  animTimeouts.push(t);
  return t;
}

function clearAnimTimeouts() {
  animTimeouts.forEach(t => clearTimeout(t));
  animTimeouts = [];
}

    { title: '3️⃣ 自注意力', text: 'Query-Key-Value 機制捕捉全局依賴' },
    { title: '4️⃣ FFN', text: '非線性變換提升表達能力' },
    { title: '5️⃣ 概率', text: 'Softmax輸出詞表概率分佈' },
    { title: '6️⃣ 自回歸', text: '逐Token生成，循環直至結束' },
  ];

  el.innerHTML = `
    <div style="text-align:center;width:100%;">
      <div style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:6px;">🎉 完整流程總結</div>
      <div style="font-size:12px;color:var(--text2);margin-bottom:18px;">LLM Text Generation Pipeline</div>
      <div class="summary-grid" id="summaryGrid"></div>
      <div style="margin-top:18px;font-size:12px;color:var(--accent);opacity:0;transition:opacity .5s;" id="summaryFooter">
        💡 從GPT到BERT再到LLaMA，所有基於Transformer的模型都遵循這一基本流程
      </div>
    </div>
  `;

  const grid = document.getElementById('summaryGrid');
  cards.forEach((c, i) => {
    const card = document.createElement('div');
    card.className = 'summary-card';
    card.innerHTML = `<h3>${c.title}</h3><p>${c.text}</p>`;
    grid.appendChild(card);
    addTimeout(() => card.classList.add('show'), i * 200 + 200);
  });

  addTimeout(() => {
    document.getElementById('summaryFooter').style.opacity = '1';
  }, cards.length * 200 + 600);
}

// ===== CONTROLS =====
function goToStep(idx) {
  if (idx < 0 || idx >= STEPS.length) return;
  stopSpeech();
  renderStep(idx);
}

function nextStep() {
  if (currentStep < STEPS.length - 1) {
    goToStep(currentStep + 1);
  } else {
    stopPlaying();
  }
}

function prevStep() {
  if (currentStep > 0) goToStep(currentStep - 1);
}

function togglePlay() {
  if (isPlaying) {
    stopPlaying();
  } else {
    startPlaying();
  }
}

function startPlaying() {
  isPlaying = true;
  updatePlayBtn();
  scheduleNext();
}

function stopPlaying() {
  isPlaying = false;
  updatePlayBtn();
  if (stepTimer) { clearTimeout(stepTimer); stepTimer = null; }
}

function scheduleNext() {
  if (stepTimer) { clearTimeout(stepTimer); stepTimer = null; }
  if (!isPlaying) return;
  const baseDelay = 8000;
  stepTimer = setTimeout(() => {
    if (isPlaying && currentStep < STEPS.length - 1) {
      nextStep();
    } else {
      stopPlaying();
    }
  }, baseDelay / playSpeed);
}

function updatePlayBtn() {
  document.getElementById('playBtn').textContent = isPlaying ? '⏸' : '▶';
}

function updateProgress() {
  const pct = ((currentStep + 1) / STEPS.length) * 100;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${currentStep + 1} / ${STEPS.length}`;
}

function setSpeed(speed) {
  playSpeed = speed;
  document.querySelectorAll('.speed-btn').forEach(b => {
    b.classList.toggle('active', parseFloat(b.dataset.speed) === speed);
  });
}

// ===== SPEECH =====
function speak(text) {
  if (!narrationEnabled || !('speechSynthesis' in window)) return;
  stopSpeech();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'zh-HK';
  utter.rate = playSpeed > 1 ? 1 + (playSpeed - 1) * 0.5 : playSpeed;
  utter.pitch = 1;
  speechSynthesis.speak(utter);
}

function stopSpeech() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}

// ===== EVENTS =====
function bindEvents() {
  document.getElementById('playBtn').addEventListener('click', togglePlay);
  document.getElementById('nextBtn').addEventListener('click', () => { stopSpeech(); nextStep(); });
  document.getElementById('prevBtn').addEventListener('click', () => { stopSpeech(); prevStep(); });

  document.querySelectorAll('.speed-btn').forEach(b => {
    b.addEventListener('click', () => setSpeed(parseFloat(b.dataset.speed)));
  });

  document.getElementById('narrationToggle').addEventListener('change', e => {
    narrationEnabled = e.target.checked;
    if (!narrationEnabled) stopSpeech();
  });

  document.getElementById('progressBg').addEventListener('click', e => {
    const rect = e.currentTarget.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    const idx = Math.min(STEPS.length - 1, Math.floor(pct * STEPS.length));
    goToStep(idx);
  });

  document.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'k') { e.preventDefault(); togglePlay(); }
    if (e.key === 'ArrowRight') nextStep();
    if (e.key === 'ArrowLeft') prevStep();
  });
}

// ===== START =====
document.addEventListener('DOMContentLoaded', init);
</script>
