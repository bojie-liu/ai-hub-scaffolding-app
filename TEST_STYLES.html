<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Test - Place Value Lesson</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Place Value Lesson Plan</div>
        <div class="role-selector">
            <select><option>Teacher</option><option>Student</option></select>
        </div>
    </nav>
    
    <div class="container">
        <header class="hero">
            <h1>CSS Styling Test</h1>
            <div class="lesson-meta">
                <span class="badge">Primary 3</span>
                <span class="badge">60 minutes</span>
            </div>
        </header>
        
        <div class="card-grid">
            <div class="nav-card">
                <div class="card-icon">✅</div>
                <h3>Navigation Works</h3>
                <p>Cards are styled correctly</p>
            </div>
            <div class="nav-card">
                <div class="card-icon">🎨</div>
                <h3>Colors Applied</h3>
                <p>Gradients and colors working</p>
            </div>
            <div class="nav-card">
                <div class="card-icon">📱</div>
                <h3>Responsive Design</h3>
                <p>Resize window to test</p>
            </div>
        </div>
        
        <div class="quiz-form">
            <h2>Interactive Elements</h2>
            <div class="quiz-question">
                <label>Test Question:</label>
                <input type="text" placeholder="Type here...">
            </div>
            <button class="btn btn-primary">Primary Button</button>
            <button class="btn btn-secondary">Secondary Button</button>
        </div>
    </div>
</body>
</html>
